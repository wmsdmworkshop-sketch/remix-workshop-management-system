& Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nCVBU Service Tracking Sheet Process - Login\n\nBack to Annexure\nCVBU Service Tracking Sheet Process - Sitemap\n1. Active Position: DSvAdv\n2. Click on Sitemap\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – Service Request\nClick on Service Request\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – Service Request\nClick on Service Request\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – Service Request\nClick on My Service Request(CVBU)\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – Open Service Request\nClick on Search button\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – Open Service Request\n1. Query with “Open” status\n2. Click on Go button\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – Open Service Request\nOpen Status Service Request will reflect here\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – BIP Report\n1. Click on Report button\n2. Select Report Name: Tracking Sheet\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – BIP Report\nClick on Submit button\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – BIP Report\nReport will be downloaded\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – BIP Report\n\nBack to Annexure\nCVBU Service Tracking Sheet Process – BIP Report\n\nQue. Which position is required to download the Tracking Sheet?\u000bAns. DSvAdv, DSvGM and DSvM position is responsible for downloading the Tracking sheet.\u000b\u000bQue. What should be the status of Service Request to download Tracking sheet?\u000bAns. Service Request status needs to be in Open Status to download Tracking sheet.\u000b\u000bQue. What is the use of Tracking sheet?\u000bAns. User can check all the works that need to be done against the Vehicle.\u000b\u000bQue. What is the process if User is not having CRMDMS User Id?\nAns. The user must contact the System Admin of their organization who must raise a request in CRMDMS Support for CRMDMS User ID creation with required position and responsibility along with approval of their respective TSM/CSM of TML.  \nThe below excel is the User ID creation template in which user details must be filled along with required position and responsibility and a request should be raised to CRMDMS Support along with approval for User ID creation.\nFAQ\n\nFor any issues, contact CRMDMS Support through the following channels\n\nRaise a ticket in system\nLogin to : https://itservicedesk.tatamotors.com/TataMotors/login-signin\nRefer attached User guide to raise a ticket.\n\n\n\n2. Call : 020-67136800\n3. Email : crmdms@tatamotors.com\nContact and Support"}, {"id": 19, "doc": "WARRANTY CLAIM", "cat": "Warranty", "content": "PPT Name : CVBU_Dlr_Service_Warranty_Claim\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nService Warranty Claim Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nThe CVBU Warranty Claim contains the following three broad level processes\nProcess Flow\nBack to Annexure\n\nCVBU Warranty Claim Generation\nProcess Flow\nBack to Annexure\n\nCVBU Warranty Claim Generation – Login\nBack to Annexure\nLogin with DSvAdv User ID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nCVBU Warranty Claim Generation – JC Search\nBack to Annexure\n2. Click on Order\n1. Click on Sitemap\n\nCVBU Warranty Claim Generation – JC Search\nBack to Annexure\nClick on Job Cards\n\nCVBU Warranty Claim Generation – JC Search\nBack to Annexure\nQuery with Job Card #\n\nCVBU Warranty Claim Generation – JC Search\nBack to Annexure\nClick on Job Card Invoice view tab\n\nCVBU Warranty Claim Generation – Generate the Claim\nBack to Annexure\nClick on Consolidated Invoice\n\nCVBU Warranty Claim Generation – Generate the Claim\nBack to Annexure\nClick on Generate Claim button\nNote: You have to click on Generate Claim button within 7 days of Initial Job Card Closure  Date to generate Warranty claim against job card.\n\nCVBU Warranty Claim Generation – Generate the Claim\nBack to Annexure\nThe user will get this pop up if he clicks the Generate claim button without an active invoice when at least one job or part is under any type of Warranty or Goodwill billing type and not in Cancelled status.\n\nCVBU Warranty Claim Generation – Generate the Claim\nBack to Annexure\nThe user will not be able to reopen the Job card if at least 1 line item is there in any type of Warranty/Goodwill claim.\n\nCVBU Warranty Claim Generation – Generate the Claim\nBack to Annexure\nThe user will not be able to cancel the invoice if at least 1 line item is there in any type of Warranty claim/Good will.\n\nCVBU Warranty Claim Submission\nProcess Flow\nBack to Annexure\n\nCVBU Warranty Claim Submission – Login\nBack to Annexure\nLogin with DSvCM User ID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nCVBU Warranty Claim Submission – Claim Search\nBack to Annexure\nActive Position: DSvCM\nClick on Sitemap\n\nCVBU Warranty Claim Submission – Claim Search\nBack to Annexure\nClick on VCM Claims\n\nCVBU Warranty Claim Submission – Claim Search\nBack to Annexure\nClick on Warranty Claims\n\nCVBU Warranty Claim Submission – Claim Search\nBack to Annexure\nQuery with Job Card#\n\nCVBU Warranty Claim Submission – Claim Search\nBack to Annexure\nIf the claim is already generated for the job card, details will reflect here\n\nCVBU Warranty Claim Submission – Claim Detail View\nBack to Annexure\nSelect Warranty Claim Detail from dropdown\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\nSelect Claim Category as per requirement\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\n1. Click on Dealer Code pick applet\n2. Select the Dealer Code\n2. Click on OK\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\n1. Enter Pay Load\n2. Enter Complaint Description, Investigation, Action Taken\nNote: Character Limit is 255 for each fields i.e. Complaint Description, Investigation, Action Taken\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\nIf dealer tries to enter more character then below message will be displayed. ‘Investigation cannot exceed 255 characters’\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\nSelect Parts Sales Price List\n\nCVBU Warranty Claim Submission – CSR/CAC\nBack to Annexure\nSelect CSR/CAC Number and Travelled KM for Deputation Charges Job Code\nNote: CSR / CAC number and Travelled KM’s will be mandatory if there are any line item with the job code selected is 99005A or 99005M at the line item level. Pop-up message to be displayed if the user clicks on Submit button without selecting the CSR/CAC number and mentioning the KM’s as “Please select CSR/CAC number for the claim and also enter the Travelled KM’s”\nIn addition, The selected CSR/CAC number has to be created maximum -3 days from complaint date and upto +7 days from vehicle repair date of warranty claim and for that chassis. If this validation is not satisfied then a pop up message will be displayed as “CSR / CAC number is Invalid”. \nSpecial Charges will be auto calculated for the selected deputation charges job code.\n\nCVBU Warranty Claim Submission – QRT\nBack to Annexure\nThe CSR number will be picked in claim screen by user manually.\nQRT details with respect to CSR will be displayed in QRT view.\nThe Travelled KM will be entered by user.\n\nCVBU Warranty Claim Submission – QRT\nBack to Annexure\nIf the KM entered in Travelled KM field at Claim details is not matching with the Travelled KM value displayed in QRT view, than system will throw a pop during the submission of claim.\n“The KM entered in Travelled KM field is not matching with Travelled KM value in QRT view. Kindly check and proceed.”\nNo pop will be displayed if there are no details present in QRT details.\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\n1. Click on Line Items view tab\n2. Click on New (+)\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\nEnter the required details like Complaint Code, Job Code, Fail Code, Aggregate#, Part#, Quantity etc.\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\nSelect Source from the drop down\n\nCVBU Warranty Claim Submission – Enter Mandatory Details\nBack to Annexure\nSelect approved Authorization Request# for all the line items for any Extended Warranty Claim\nNote: A new validation in the claim screen while selecting the Claim category as Extended Warranty.\nAn Error will be pop up if user select claim category as extended warran"}, {"id": 20, "doc": "DLR ALL CRM SUPPORT PROCESS", "cat": "CRM Support", "content": "Title\nTitle: CRM Support Tool\nSubtitle: - New Support Tool\n\n01\nNew Support Tool\n\nURL: https://itservicedesk.tatamotors.com\n\nEnter the URL: https://itservicedesk.tatamotors.com\nAbove screen will be visible on entering to URL: http://itservicedesk.tatamotors.com \n\nTo Login use your CRMDMS Login ID and Password\n\nHome Page\nThis is Home Page of new Support Application.\nMy Tickets – This section will show tickets raised by you\nNews and bulletin – This section will show Alerts and Bulletins regarding CRM and CRM Support\n\nHome Page\nOn Clicking to this Symbol, Application will run in Full Screen Mode\n\n      Click to this Symbol to search any specific Request number\n\n       This Icon Indicate Unread Alerts for you. Click to check alerts in details\n\n       Click this Icon for using ‘Self Service’ Tab wherein you can check all Requests raised by you\n\n       You can Reset you Password by clicking on this Option\n\nHome Page\nOn Moving cursor to left side of the screen, you will see above options:\n\nSelf Service – You can see all you Requests and their status\nUser Profile  – You can reset your password from here\n\nInternal Views\nIn “My Service Requests”, you will see above fields for the tickets raised by you\nClick on “New” to create new request, details shown in subsequent slides\nUnder “Change Password”, you are requested to change password on first login\n\nHow to create new Request:\nNew:  Click to raise Request\nClose:  Click to filter to show only closed Requests in the view\nExport to Excel:  Click to export the all Request details in Excel format\n\nHow to Check Requests:\nClick on ‘My Service Requests’ to see current Requests which are in below status\nOpen\nIn Progress\nPend Customer\nPend Vendor\nTo See Resolved Requests, click on ‘Close’ Link at top right corner. It will show only below status requests:\nFulfilled – Resolved and can be reopened by calling CRM Team\nClosed – This Request is resolved and cannot be Re-Opened\n\nHow to create new Request:\nRequestor:  Who raised Request\nOpened: Request Raised Date/Time\nOn Behalf of: Remedy ID of person on behalf of the other user than person who is raising Request (Remedy ID is same as CRM ID)\nCategory/Sub Category/Item:  These are Issue Categories, please select Appropriate Category\nShort Description: Enter short description of the issue\nAdditional Comments: Enter detailed description of the issue along with all details/errors\nSubmit: Click on Submit button on raise the new REQ. On clicking ‘Submit’, you will see Request # on screen. \n\n* You will able to attach any document only after Request number is generated, same is shown in next slide.\n\nHow to create new Request:\nClick on “I” icon to see\n                    details about the user ID.\nYou can See below details:\nUser ID: \n Business Phone\nFirst Name\nLast Name\nMobile\nDepartment\nTitle\nActive\neMail ID\nUser Type\n\nHow to create new Request:\nAfter creating Request Number, go to detailed view and click on              Symbol to get more options:\n\nAdd Notes:  You can Add notes/comment/details for your support team reference \nAdd Attachment: You can add attachment in that request and can be downloaded as well\nView Attachment: You can view attachment by clicking on ‘Add Attachment’ icon\n\nYou can check status of Request on this screen and status will:\nOpen  Request is yet to attended\nProcessing  Someone from Support team has started working on the Request\nPend 3rdParty or Pend Customer  Request is kept in Pending due to some information/clarification from user\nFulfilled  Request is resolved.\n\n13\nContact and Support :\n\nTo raise Support Request / CRMDMS Help / IT support\u000b\nLogin to Remedy: https://itservicedesk.tatamotors.com\u000b\nOr   Mail:   crmdms@tatamotors.com\u000b\nOr  Call :  020 67136800"}, {"id": 21, "doc": "ALL MULTIFACTOR AUTHERNTICATION FOR CRMDMS NEXTGEN AND ANALYTICS APPLICATIONS", "cat": "CRM Support", "content": "2FA for CRM Analytics Applications\nObjective: \nEnhance the security of CRM-Analytics Applications by implementing Two-Factor Authentication (2FA) using Microsoft /Google Authenticator App.\n\nWhy 2FA?\nStrengthens account security by requiring a second verification step in addition to a password.\nProtects against unauthorized access even if passwords are compromised.\n\nHow it works\nUser Login Attempt\nUser enters their username and password in the CRM-Analytics application.\n\nDownload Authenticator App in Mobile\nUsers to download the Microsoft /Google Authenticator app in Play store / App store. \n\nMicrosoft /Google Authenticator User Registration\nUser scans a QR code provided by the CRM-Analytics application.\nMicrosoft / Google Authenticator starts generating 6-digit codes that refresh every 30 seconds.\n\n2FA One time code\nAfter the initial login, the system prompts for a time-based one-time password (OTP) generated by Microsoft /Google Authenticator  App .\n\nVerification\nUser enters the OTP from Microsoft /Google Authenticator to complete login.\nIf the code matches, access is granted.\n\n2FA Authentication for CRM Analytics (OLAP) Users\n\n2FA Authentication for CRM Analytics\n         Microsoft Authenticator/ Google Authenticator\n\nMicrosoft Authenticator App Installation in Mobile\nAndroid\niOS\nOn your Android device, open the Google Play Store. \nSearch for “Microsoft Authenticator\". Install the app.\nOn your iOS device, open the App Store.\nSearch for “Microsoft  Authenticator\". Install the app.\n\nGoogle Authenticator App Installation in Mobile\nAndroid\niOS\nOn your iOS device, open the App Store.\nSearch for \"Google Authenticator\". Install the app.\nOn your Android device, open the Google Play Store. \nSearch for \"Google Authenticator\". Install the app.\n\nLogin into Analytics application\nLogin to your Analytics application by using your User ID & Password.\n\nMicrosoft Authenticator / Google Authenticator App Registration\nAfter logging in with the CRM Analytics User Id &Password, application will navigate to the Authentication screen.\nYou'll be presented with a QR code in CRM Analytics Application.\n\nMicrosoft Authenticator App Registration\nScan the QR code with your Mobile’s camera\nOpen the Microsoft Authenticator app in Mobile.\nClick on check box  & Continue.\nSelect \"Scan a QR code\"\n\nMicrosoft Authenticator App Registration\nMicrosoft Authenticator App\n730134\nMobile\nClick on ‘Submit’ button to complete the Microsoft Authenticator app.\nEnter the one time code displayed in Microsoft Authenticator  app.\nEnter the Device name as ‘Mobile’\n\nGoogle Authenticator App Registration\nOpen the Google Authenticator app in Mobile.\nTap the \"+\" button (or \"Get Started\" if it's the first time).\nSelect \"Scan a QR code\"\nScan the QR code with your Mobile’s camera\n\nCRM Analytics Login Via Microsoft Authenticator\nStep3. Enter this six-digit code displayed in Microsoft Authenticator app into the CRM Authentication Screen to access the CRM Analytics Application.\n730134\nStep 1. Login to CRM Analytics Application with User ID and Password.\nAfter login in, user will be taken to a screen where user need to input OTP.\nStep2. Open Microsoft authenticator app.\nThe Microsoft Authenticator app will generate a six-digit code.\n\nCRM Analytics Login Via Google Authenticator\nStep3. Enter this six-digit code displayed in Google Authenticator app into the CRM Authentication Screen to access the CRM Analytics Application.\n653364\nStep2. Open Authenticator app, the Google authenticator.\nThe Google Authenticator  app will generate a six-digit code.\nStep 1. Login to CRM Analytics Application with User ID and Password.\nAfter login in, user will be taken to a screen where user need to input OTP.\n\nPost removal of CRM User ID from Microsoft Authenticator from your Mobile device. \nPlease raise the ticket to CRM Analytics team for Backend removal and register with New Device.\nMicrosoft Authenticator App Account Removal\nRegistered CRM Analytics User Id removal process from Microsoft Authenticator. \nClick on arrow.\nClick on settings Button.\nClick on Remove account\n\nUser is successfully authenticated with MFA and Login in to CRM Analytics Application.\nAnalytics Login Via Microsoft Authenticator/ Google Authenticator\n\nPost removal of CRM User ID from Google Authenticator from your Mobile device. \nPlease raise the ticket to CRM Analytics team for Backend removal and register with New Device.\nGoogle Authenticator App Account Removal\nDemo Video\nRegistered CRM Analytics User Id removal process from Google Authenticator. \nSwipe from Right to Left against the User registered to remove. (Refer Video)\n\nAnalytics Login Via Google Authenticator\nStep3. Enter this six-digit code displayed in Google Authenticator into the Analytics Authentication Screen to access the CRM Analytics Application.\n653364\nStep2. Open Authenticator app, the google authenticator.\nThe Google Authenticator app will generate a six-digit code.\nStep 1. Login to Analytics Application with User ID and Password.\nAfter login in, user will be taken to a screen where user need to input OTP.\n\nAnalytics Login Via Microsoft Authenticator\nStep3. Enter this six-digit code displayed in Microsoft Authenticator into the Analytics Authentication Screen to access the CRM Analytics Application.\n730134\nStep 1. Login to Analytics Application with User ID and Password.\nAfter login in, user will be taken to a screen where user need to input OTP.\nStep2. Open Authenticator app, the Microsoft authenticator.\nThe Microsoft Authenticator app will generate a six-digit code.\n\nFAQs\n1. What is Two-Factor Authentication (2FA)?\n2FA is an extra layer of security for your CRM- Analytics account. Besides your password, you’ll need to enter a code from your mobile device to log in. This helps protect your account even if your password is stolen.\n\n2. Why is 2FA important?\nIt strengthens security by requiring two forms of verification—your password and a time-sensitive code—making it much harder for unauthorized users to access your account.\n\n"}, {"id": 22, "doc": "LOYALTY DETAILS CHECK AND REDEMPTION", "cat": "Loyalty", "content": "PPT Name : CVBU_Dlr_Service_JC_Loyalty_Details_Check_and_Redemption\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nLoyalty Payment Creation Process\nPayment Settlement Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nThe Warranty Claims contains the following two broad level processes\nProcess Flow\nBack to Annexure\n\nLoyalty Points Redemption\nProcess Flow\nBack to Annexure\n\nBack to Annexure\nLoyalty Points Redemption - Login\nLogin with DSvCash User ID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nLoyalty Points Redemption\nBack to Annexure\nActive position: DSvCash\n1. Click on Sitemap\n2. Click on Order\n\nLoyalty Points Redemption\nBack to Annexure\n1. Query with Job Card#\n2. Click on GO\n3. Toggle to Job card Details\n\nLoyalty Points Redemption (Emperor Customers)\nBack to Annexure\n1. Check Final Amount\n2. Loyalty Tier: Emperor\n\nLoyalty Points Redemption\nBack to Annexure\nClick on Payments View Tab\n\nLoyalty Points Redemption\nBack to Annexure\nCheck Loyalty Balance Points\n\nLoyalty Points Redemption\nBack to Annexure\n2. Click on LOY Verification\n1. Enter Requested Points(<= LOY Balance Points) and LOY Member status needs to be Active\n\nLoyalty Points Redemption\nBack to Annexure\n1. CSR No.# will be generated for Delight or Emperor Customers for Verification of Requested Points\nOnce the CSR is generated, Approval Status will be updated as “Verification Initiated”, CSR Status as “Open” and CSR Sub-Status as “Unassigned”\n\nLoyalty Points Redemption\nBack to Annexure\nLoyalty Points Redemption Process for Loyalty Delight Members:\nRestrictions:\nDelight redemption is applicable only to redeem the points against the loyalty member only for the JC.\nDelight customers do not get any points accrued as per policy effective 1st May-2023. The same will continue AS IS\nOnly Dealerships are allow to do the redemption process for the delight member. TASS/Distributor are not allow to do the redemption. OTP + button will always disabled for the delight customers for the JC only.\n\nLoyalty Points Redemption Process :\nOnce CSR is generated, System will generate Email to the CCA team( Delight@tatamotors.com) and SMS to loyalty member contact \nFrom Email ID: crmdmsworkflow@tatamotors.com\nTo Email ID: Delight@tatamotors.com \nSubject: Delight Redemption Request – 1-194159157891\n \nDear Delight Help Desk,\n \nThere is a CSR '1-194159157891' for Redemption request raised by M/s 'ABT INDUSTRIES-1001650', 'MADURAI' against Order No 'JC-ABTIN-MD-2324-006949'. The contact of the workshop is '7276090450'.\nInitially customer has to connect with CSM with the help of dealer for delight redemption` approval. Business will send the SOP to all CSM for the delight redemption process. CSM will approve the customer email based on genuiness and send approval to delight@tatamotors.com .CCA team will verify the CSR as per the mail of CSM and Customer request mail to CSM once CRM auto-generated mail received.\n\nLoyalty Points Redemption\nBack to Annexure\nOnce CSR Status is Closed, the Approved Points will updated.\nPost verification, CCA team will update the CSR Sub status and Approval Status as “Redemption Approved” and update the CSR Status as “Closed”.\n\nLoyalty Points Redemption\nBack to Annexure\n1. Click on + to generate Receipt\n2. Select Payment Method as “Loyalty Points”\n3. Select Payment Type as “Self”\n4. Enter Approved Points as Amount\n5. Click on Save button\n\nLoyalty Points Redemption\nBack to Annexure\n1. Click on + to generate Receipt\nSystem will throw Pop-up as “Payment Amount more than Approved Points cannot get realized(SBL-EXL-00151)”, if  user enters more than approved points then below error will reflect.\n\nLoyalty Points Redemption\nBack to Annexure\nPayment receipt will realized with “Y” automatically if Approval Status is “Redemption Approved”\n\nLoyalty Points Redemption\nBack to Annexure\nClick on Payment Receipt hyperlink\n\nLoyalty Points Redemption\nBack to Annexure\n1. Click on Report Button\n2. Click on Submit Button\n\nLoyalty Points Redemption (BIP Report)\nBack to Annexure\n\nPayment Settlement\nProcess Flow\nBack to Annexure\n\nBack to Annexure\nLogin with DSvCash User ID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nPayment Settlement - Login\n\nBack to Annexure\nActive position: DSvCash\n1. Click on Sitemap\n2. Click on Order\nPayment Settlement\n\nBack to Annexure\n1. Query with Job Card#\n2. Click on GO\n3. Toggle to Job card Details\nPayment Settlement\n\nPayment Settlement\nBack to Annexure\n1. Click on Job Card Invoice(View Tab)\n2. Click on Invoice hyperlink\n\nPayment Settlement\nBack to Annexure\n2. Click on New(+) in Payment Settlement\n1. Click on Payment Settlement View Tab\n3. Select Payment Receipt of Loyalty Payment created for Job card from Pick Applet\n\nPayment Settlement\nBack to Annexure\nEnter Settled Amount and Save\n\nPayment Settlement\nBack to Annexure\nThe Settled Amount and Invoice Balance Amount will be updated.\n\nQue. Who is the person responsible for payment creation and settlement?\nAns. Service Cashier(DSvCash) is responsible for payment creation and settlement.\n\nQue. What if LOY point is not available?\nAns. Payment cannot be made through Loyalty Points of Loyalty member.\n\nQue. Requested Loyalty Points are not verified against LOY member?\nAns. Kindly check Loyalty Balance Points which should be greater than Requested Loyalty Points. \n\nQue. What should be the Approval Status for Requested Loyalty points, in order to generate Payment Receipt?\nAns. Approval Status should be Redemption Approved , to generate Payment Receipt of Approved Loyalty Points.\n\nQue. What should be the Payment Type in Payment Receipt Line Item?\nAns. Payment Type should be “Loyalty Points” in Payment Receipt Line Item.\nFAQ\n\nFor any issues, contact CRMDMS Support through the following channels\n\nRaise a ticket in system\nLogin "}, {"id": 23, "doc": "ACCOUNT AND CONTACT CREATION", "cat": "Account/Contact", "content": "PPT Name : CVBU_Dlr_Service_Account & Contact_Creation\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nAccount Creation Process\nContact Creation Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nAccount Creation Process\nBack to Annexure\nAccount Creation\n\nAccount Creation\nProcess Flow\nBack to Annexure\n\nAccount Creation - Login\nBack to Annexure\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nLogin with DSvAdv User ID & Password\n\nAccount Creation\nBack to Annexure\nActive position: DSvAdv\n1. Click on Sitemap\n2. Click on Account\n\nAccount Creation\nBack to Annexure\nClick on Account List\n\nAccount Creation\nBack to Annexure\n1. Toggle to All Accounts\n2. Click on New(+)\n3. Click on Cancel\n\nAccount Creation\nBack to Annexure\n1. Enter Account Name\n2. Select Account Type\n3. Enter Main Phone#\n4. Enter Site\n5. Enter PAN#\n6. Enter GSTIN#\n7. Click on Pick Applet to enter the Address field\n\nAccount Creation\nBack to Annexure\nClick on + button to Add new Address\n\nAccount Creation\nBack to Annexure\n1. Select District\n2. Select City/Town/Village\n3. Fill Address Lines\n4. Select Address Type\n5. Click on Save button to save the records\n\nAccount Creation\nBack to Annexure\nUnique Account ID created for each Account\n\nAccount Creation – Ancillary Master Creation for Vendors\nBack to Annexure\nAccount Creation\n\nAccount Creation – Ancillary Master Creation for Vendors\nBack to Annexure\nAncillary Master Creation:\n\nIntroducing a new LOV in account type under account creation.\n\nACCOUNT_TYPE:\n1. Ancillary Vendor- for parent account\n2. Ancillary Subcontractor- for sub account\n\nCSM will have the access to update and modify the Ancillary Vendor or Ancillary Subcontract account type with the position CSE only.\nAs per the below mentioned table CSM can be update the Account Type from state to state.\n\nAccount Creation – Ancillary Master Creation\nBack to Annexure\nAncillary Vendor account creation in CRM:\nCurrently in CRM, there are 55 vendor details available those vendors created as Parent account with account   type as Ancillary vendor in CRM from backend as one time master. Those vendor account name mentioned at the end.\nFor further Ancillary vendor creation, CSM will get the TML business approval to create the Ancillary vendor account in CRM.\n\n\nAncillary Sub Contractor account creation in CRM: \nDSvM will create the subcontractor account in CRM. Account creation process will be existing process.\nWhile creating an Account, Account Name, Account Type, Main Phone, Site, Parent field, Email ID and Aggregates are mandatory to update the account type as Ancillary Subcontractor in account.\nAfter creation of account with mandatory details introducing new view tab in account screen “Aggregate” and Aggregate field (LOV) to add the Aggregate against the subcontractors account.\nDSvM will send the account details to CSM through email for verification with below details.\n\nAccount Creation – Ancillary Master Creation for Subcontractor\nBack to Annexure\n1. Enter Subcontractor Name\n2. Enter Main Phone#\n3. Enter Email\n4. Enter Site\n5. Enter Parent Account (Vendor)\n5. Enter Aggregate details\n\nIf dealer user trying to update the Account Type from “Non- Specified” to “Ancillary Vendor” or “Ancillary Subcontractor”, a Pop-up Message will be appear.\nAccount Creation – Ancillary Master Creation\nBack to Annexure\n\nAccount Creation – Ancillary Master Creation for Subcontractor\nBack to Annexure\nCSM will verify the subcontractor details, parent account and aggregate to update Account Type as “Ancillary subcontractor” from “Not specified” for the Sub Contractor account (CSM will receive mail from CP to update the sub account as format shown in previous slide).\nOnce CSM change the account type “Ancillary Subcontractor” Account details will become read-only and aggregate + button will disabled.\nIf any modification required DSvM has to request the CSM over mail for updating the account type to Not Specified from Ancillary Sub contractor. \nOnce the master created in CRM with sub accounts and aggregates. CSM’s will able to map the same vendor and subcontractor details against their respective division as per dealer request on mail.\n\nContact Creation Process\nBack to Annexure\nContact Creation\n\nContact Creation\nProcess Flow\nBack to Annexure\n\nContact Creation - Login\nBack to Annexure\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nLogin with DSvAdv User ID & Password\n\nContact Creation\nBack to Annexure\nActive position: DSvAdv\n1. Click on Sitemap\n2. Click on Contact\n\nContact Creation\nBack to Annexure\nClick on All Contacts\n\nContact Creation\nBack to Annexure\nClick on New(+) to create new Contact\n\nContact Creation\nBack to Annexure\n1. Enter Last Name\n2. Enter First Name\n3. Enter Cell Phone No.\n5. Click on Pick Applet to enter Address field\n4. Enter GSTIN #\n\nContact Creation\nBack to Annexure\nClick on New(+) to create new Address\n\nContact Creation\nBack to Annexure\n1. Select District\n2. Select City/Town/Village\n4. Select Address Type\n3. Fill all Address Lines\n5. Click on Save Button to save the records.\n\nContact Creation\nBack to Annexure\nContact ID will reflect\n\nQue. What is ARN?\nAns. ARN is Account relationship Number. When a vehicle is invoiced to an account , then an ARN is generated against the Account which is unique.\n\nQue. What is CRN?\nAns. CRN is Contact relationship Number. When a vehicle is invoiced to a contact , then an CRN is generated against the Account which is unique.\n\nQue. Do we need to Create a Account If there are Changes with Mobile Number, PAN #, GSTIN?\nAns. No. You can update the Account details by raising an SR through KYC Handbook if ARN is updated against an Account.\n\nQue. So do we need to create new account if existing customer wants to buy the vehicle from any dealership?\nAns. No. The User can search for existing account w"}, {"id": 24, "doc": "Service Advisor Performance", "cat": "General Process", "content": "Reports from Order Screen\nReports from Invoice Screen\nIn this course we will learn :\nOverview\n2\n\nOverview\nDealer Service advisor wise performance can be generated from OLTP.\nEmployee productivity can be monitored\n3\nThis will help management to compensate employees based on their performance\n\nLogin to the application with user ID and password\n\n2. Click on Order Screen\n1. Login as Service Admin\n\n6. Click on Go\n5. Query with SR Assigned to and with Created Date  / Time\nSR Assigned to is the Service Advisor CRM id.\nDate format for querying used should be “dd/MM/yyyy”\nEx. while using query on date column\nDate=“31/01/2014” in order to retrieve details for a single day viz. 31st Dec 2014.\nDate= “>=01/12/2014 AND <=31/12/2014” in order to retrieve details for a specific period viz. 31st Dec 2014\n\nDelivery Variance in hour are showing here\nDelivery Variance % are showing here\nAll JC of the queried SA are showing here\nAll JC of the queried date are showing here\nContinued…\n\nFinal parts Amount of all JCs\nFinal Labour Amount of all JCs\n% of estimated Variance\n\n1. Click on Site Map\n2. Click on Invoice screen\n\n5. Query with SR Assigned to and with Invoice Date\n6. Click on Go\n\nService Taxes against all jobs are showing here.\nOther Charges against the invoices of that SA is showing here\nFinal Labour Invoice amount of all JC of the SA is showing here\nAll invoice of the queried SA are showing here"}, {"id": 25, "doc": "AMC CLAIM", "cat": "AMC", "content": "PPT Name : CVBU_Dlr_Service_AMC_Claim\nProcess :\nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nAMC Claim Process\nAMC Claim Settlement Process\nBIP Reports\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : \thttps://crmsdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nProcess Flow\nThe AMC Claim contains the following two broad level process\nBack to Annexure\n\nAMC Claim Settlement\nProcess Flow\nBack to Annexure\n\nAMC Group Claim Settlement\nProcess Flow\nBack to Annexure\n\nLogin with DSvCM User\nID & Password\nAMC Claim- Login\nApplication URL : \thttps://crmsdms.inservices.tatamotors.com/workshop\nBack to Annexure\n\nClick on Sitemap\nActive Position : DSvCM\nAMC Claim- Login\nBack to Annexure\n\nClick on VCM Claims\nAMC Claim- VCM Claims\nBack to Annexure\n\nClick on CVBU AMC Claims\nAMC Claim- VCM Claims\nBack to Annexure\n\n2. Query with Job Card Number\n1.Click on Query\nAMC Claim- VCM Claims\nBack to Annexure\n\nToggle to AMC Claim Details view\nAMC Claim- Details\nBack to Annexure\n\n1. Provide Complaint Description\nAMC Claim- Details\nBack to Annexure\n2. Provide Investigation\n3. Provide Action Taken\n\n2. Provide Complaint code, Job code, Part no, Remarks in two separate line items\nAMC Claim- Line Items\nBack to Annexure\n1. Line Items view tab\n\nAMC Claim- Line Items\nBack to Annexure\nTwo fields named Qty Shipped and No. of Parts to claim have been brought at AMC/FMS claims line level. \u000bQty Shipped is the JC Shipped Qty, which will not be editable to the dealer. \u000bNo. of Parts to claim field is the Qty which the dealer wish to claim. This will be editable to the dealer, but the max Qty. that can be entered is the Shipped Qty.\n\nAMC Claim- Line Items\nBack to Annexure\nTick the Job entry Complete and Part Entry Complete flag\n\n1. Click on Attachments view tab\nAMC Claim- Attachments\nBack to Annexure\n2. Select the Required Document\nOdometer snap is a compulsory requirement for AMC/FMS and Paid Extended Warranty claim processing. Document type odometer snap is compulsary and it will show a pop up at claim submission stating “Odometer snap not attached. Please attach it before Claim Submission”, if it’s not attached\n\nAfter Clicking on Validate If the Claim Status=“Validated” Submit button gets visible now click on this button to submit the claim\nAMC Claim- Validation\nBack to Annexure\n\nAfter Submit Claim status will be Sent to TM\nAMC Claim- Claim Status\nBack to Annexure\n\nCheck the Claim Status\nAMC Claim- Claim Status\nBack to Annexure\nSent to TM – The claim is Submitted by DSvCM to TM and is pending for approval from TM\nApproved by L1 and Approved by L2 – Approval of Claim by TM by GDC Team.\nSettled – The Claim is Settled by TM after L2 approval.\n\nIndividual AMC Claim submission\nAMC Claim Settlement\nBack to Annexure\n\nClick on Sitemap and Click External Application\nAMC Claim- Settlement\nBack to Annexure\n\nClick on AMC / FMS Generation\nBack to Annexure\nAMC Claim- Settlement\n\nClick on My Home\nAMC Claim- Settlement\nBack to Annexure\n\nAMC Claim- Settlement\nBack to Annexure\nOnce the claim is Approved by L2, the dealer has to generate the invoice and submit for further processing.\nBelow are the invoice statuses which will be updated against the claims\n\nPending With Dealer-New\nPending With Dealer-Reconsideration\nReady For Download/Upload\nAwaiting Approval\nSettlement In Progress\nSettled and Closed\n.\n\nAMC Claim- Settlement\nBack to Annexure\n1. Select Pending With Dealer-New\n2. Select Month and Year\n5. Click Get Details\n3. Select Claim Type\n4. Select Year\n\nClick on SAP No\nAMC Claim- Settlement\nBack to Annexure\n\nClick on Generate IRN for IRN generation\nAMC Claim- Settlement\nBack to Annexure\n\nInvoice no and date updated\nAMC Claim- Settlement\nBack to Annexure\n\nClick on submit option\nAMC Claim- Settlement\nBack to Annexure\n\nClick on yes option\nAMC Claim- Settlement\nBack to Annexure\n\nMessage will be prompted\nAMC Claim- Settlement\nBack to Annexure\n\nClick on Cancel IRN to cancel the IRN within 24 hrs from Generation of IRN\nAMC Claim- Settlement\nBack to Annexure\n\nClick on Generate CR Note for credit note generation\nAMC Claim- Settlement\nBack to Annexure\n\nNow select ready for download /upload\nAMC Claim- Settlement\nBack to Annexure\n\nAMC Claim- Settlement\nBack to Annexure\n1. Select Month and Year\n2. Click on  Get details\n\nAMC Claim- Settlement\nBack to Annexure\n2. Click on  Download invoice PDF print\n1. Click on SAP No\n3. Click on Submit\n\nAMC Claim- Settlement\nBack to Annexure\nDigitally sign the downloaded invoice copy and click on upload digital signature invoice\n\nAMC Claim- Settlement\nBack to Annexure\nA soft pop up message will be displayed\n\nAMC Claim- Settlement\nBack to Annexure\nBrowse and select the digital signed invoice\n\nAMC Claim- Settlement\nBack to Annexure\nClick on yes to upload the file\n\nAMC Claim- Settlement\nBack to Annexure\nOn successful upload claim will appear in table\n\nAMC Claim- Settlement\nBack to Annexure\nClick on submit button\n\nAMC Claim- Settlement\nBack to Annexure\nClick on yes button\n\nAMC Claim- Settlement\nBack to Annexure\nClaim will get successfully submitted\n\nAMC Claim- Settlement\nBack to Annexure\nClick on view action history to check\n\nAMC Group Claim Process\nAMC Claim- Group Claim\n\nClick on Sitemap and Click External Application\nAMC Claim- Settlement\nBack to Annexure\n\nClick on AMC\nBack to Annexure\nAMC Claim- Settlement\n\nClick on Create Group Invoice\nAMC Claim- Settlement\nBack to Annexure\n\nSelect Month and Year and click on Go\nBack to Annexure\nAMC Claim- Group Claim\n\nBack to Annexure\nAMC Claim- Group Claim\n1. Select SAP Claim No.\n2. Click on Create Group\nDetails will flow here which are pending with dealer and in Approved by L2 Claim Status\n\nClick on Yes\nBack to Annexure\nAMC Claim- Group Claim\n\n1.Select Group claim\nBack to Annexure\nAMC Claim- Group Claim\n2.Select the From date and To Date\n3.Click on Get Details\n\n1. Click on Group Claim No\nBack to Annexure\nAMC Claim- Group Claim\n2. To edit group Claim click on Edit\n\nClick on"}, {"id": 26, "doc": "TATA PROMISE PLUS", "cat": "General Process", "content": "PPT Name : CVBU_Dlr_Service_TATA_Promise_Plus\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nCRM Application Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nThe Coupon redemption contains the following three broad level processes\nProcess Flow\nBack to Annexure\n\nCoupon Details Check\nProcess Flow\nBack to Annexure\n\nCoupon Details Check – Login\nBack to Annexure\n1. Login with DSvM / DSvAdv User ID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nCoupon Details Check – Vehicle Search\nBack to Annexure\n1. Active Position: DSvM / DSvAdv\n2. Click on Sitemap\n\nCoupon Details Check – Vehicle Search\nBack to Annexure\n1. Click on Vehicles\n\nCoupon Details Check – Vehicle Search\nBack to Annexure\n1. Click on Vehicles\n\nCoupon Details Check – Vehicle Search\nBack to Annexure\n1. Select All Visible Vehicles\n2. Query with Chassis#\n\nCoupon Details Check – Coupon against Chassis\nBack to Annexure\n1. Click on Coupon Details view tab\n\nBack to Annexure\nCoupon Details Check – Coupon against Chassis\n1. Details will reflect here if any Coupon is associated with the chassis\n\nCoupon Association in a Job Card\nProcess Flow\nBack to Annexure\n\nCoupon Association – Login\nBack to Annexure\n1. Login with DSvAdv User ID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nBack to Annexure\nCoupon Association – Job Card Search\n2. Click on Sitemap\n1. Active Position: DSvAdv / DSvM\n\nBack to Annexure\nCoupon Association – Job Card Search\n1. Click on Order\n\nBack to Annexure\nCoupon Association – Job Card Search\n1. Click on Order List / Job Cards\n\nBack to Annexure\nCoupon Association – Job Card Search\n1. Query with Job Card#\n1. Click on Job Card# hyperlink\n\nBack to Annexure\nCoupon Association – Add the Coupon\n1. Click on More Info view tab\n\nBack to Annexure\nCoupon Association – Add the Coupon\n1. Pick the available Coupon from the pick applet and Save\n\nBack to Annexure\nCoupon Association – Add the Discount\n2. Enter the Same Amount in “Discount Amount Field” and continue with job card closure and invoice\n1. Check eligible Tata Care Discount\n\nQue. Who will check the Coupon Details?\nAns. DSvM or DSvAdv can check the Coupon Details.\n\nQue. How to Check Coupon Details?\nAns. Sitemap >> Vehicles >> All Visible Vehicles >> Query with JC# >> Go to Coupon view tab >> Check the details.\n\nQue. How to Associate Coupon in a JC?\nAns. Sitemap >> Order >> Order List/ Job Card >> Query with JC# >> Click on JC# Hyperlink >> More Info view tab >> Select the Available Coupon >> Check the Eligible Discount Amount >> Enter the Discount Amount as per Eligible Discount Amount\nFAQ\n\nQue. What is the process if User is not having CRMDMS User Id?\nAns. The user must contact the System Admin of their organization who must raise a request in CRMDMS Support for CRMDMS User ID creation with required position and responsibility along with approval of their respective TSM/CSM of TML.  \nThe below excel is the User ID creation template in which user details must be filled along with required position and responsibility and a request should be raised to CRMDMS Support along with approval for User ID creation\nFAQ\n\nFor any issues, contact CRMDMS Support through the following channels\n\nRaise a ticket in system\nLogin to : https://itservicedesk.tatamotors.com/TataMotors/login-signin\n\nRefer attached User guide to raise a ticket.\n\n\n\n2. Call : 020-67136800\n3. Email : crmdms@tatamotors.com\nContact and Support"}, {"id": 27, "doc": "JC REOPEN CLOSED & KM CORRECTION", "cat": "Job Card", "content": "PPT Name : CVBU_Dlr_Service_JC_Reopen_&_KM_Correction\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nJC Reopen from Closed Status\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nJC Reopen\nBack to Annexure\nJob card Re-Opening\n\nJC Reopen from Closed Status\nProcess Flow\nBack to Annexure\n\nJC Reopen from Closed Status – Login\nBack to Annexure\nLogin with DSvM User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nJC Reopen from Closed Status – Job Card Search\nBack to Annexure\n1. Active Position: DSvM\n2. Click on Sitemap\n\nJC Reopen from Closed Status – Job Card Search\nBack to Annexure\nClick on Order\n\nJC Reopen from Closed Status – Job Card Search\nBack to Annexure\nClick on Order List / Job Cards\n\nJC Reopen from Closed Status – Job Card Search\nBack to Annexure\n1. Query with Job Card#\n2. Click on Job Card# hyperlink\n\nJC Reopen from Closed Status – Change the Status\nBack to Annexure\nChange the Status  as Open from Closed\nNote:\nInvoice should be in Cancelled status to reopen the JC.\nIf JC is Closed before 30 days and no claim is associated with it user can Reopen the same from DSvM ID.\nIf JC Closed, Initial Job Card closer date is more than 30 days and no claim is associated with it user has to create Job Card Approval Request for JC Reopening.\n\nCVBU Warranty Claim Generation – Generate the Claim\nBack to Annexure\nThe user will not be able to reopen the Job card if at least 1 line item is there in any type of AMC, PAID EW, Warranty or FMS claim.\nDelete line item functionality for AMC, FMS & PAID EW claim line item should be available only when the Claim status is “Created” or ‘Not Validated.\n\nJC Reopen from Closed Status – Change the Status\nBack to Annexure\nImplement job card reopening checks within the system to prevent users from reopening job cards until the free service claim is canceled.\nOnly system allow the job card Reopen when the FSB Claim or PDI claim status is in cancelled status. System will not allow to reopen if claim status not equal to cancelled.\n\nJC Reopen from Closed Status – Change the Status\nBack to Annexure\nOnce claim cancelled FSB claim and PDI claim cannot be re-created for this Job Card\nIf claim status request to Created, Re-Reay VCM, Rejected and Under Change in this claim status system not allow to user to reopen job card.\n\nJC Reopen from Closed Status – Reopened Job Card\nBack to Annexure\nAfter FSB Claim or PDI Claim cancelled. Now user can be proceed for job card reopen.\n\nJC Reopen from Closed Status – Reopened Job Card\nBack to Annexure\nNow JC is in Open Status. You can modify the details in JC\n\nJC Reopen\nBack to Annexure\nJC Reopen from Cancel Status\n\nJC Reopen from Cancel Status\nProcess Flow\nBack to Annexure\n\nJC Reopen from Cancel Status – Login\nBack to Annexure\nLogin with DSvGM User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nJC Reopen from Cancel Status – Job Card Search\nBack to Annexure\n2. Click on Sitemap\n1. Active Position: DSvGM\n\nJC Reopen from Cancel Status – Job Card Search\nBack to Annexure\nClick on Order\n\nJC Reopen from Cancel Status – Job Card Search\nBack to Annexure\nClick on Order List / Job Cards\n\nJC Reopen from Cancel Status – Job Card Search\nBack to Annexure\n1. Query with Job Card#\n2. Click on Job Card# hyperlink\n\nJC Reopen from Cancel Status – Change the Status\nBack to Annexure\nChange the Status as Open from Cancel\n\nJC Reopen from Cancel Status – Reopened Job Card\nBack to Annexure\nNow JC is in Open Status. You can modify the details in JC\n\nJC Reopen\nBack to Annexure\nSR closing or cancelling without creating JC\n\nJob Card Cancellation\nBelow values of Closed/Cancellation Reason are mandatory to select in the dropdown before closing or cancelling the SR :-\n\n•\tEscalated to management\n•\tVehicle Already Serviced\n•\tCustomer not contactable\n•\tCustomer Rejected Service\n•\tUndrivable vehicle \n•\tNo Fault Detected\n•\tCustomer Declined repair\n•\tCustomer relocated\n•\tCustomer is satisfied \n•\tCancelled: Time Constraints\n•\tUnresponsive After Follow-Ups\n•\tCustomer needed guidance only\n•\tIssue resolved over call\n\nJob Card Cancellation\nWhenever user closing or cancelling the SR without creating JC then below pop-up will appear.\n\nPop-up for status Closed: “Please update Closed/Cancellation Reason in service request detail for closing the Service Request if there is no Job Card Created”\n\nJob Card Cancellation\nWhenever user closing or cancelling the SR without creating JC then below pop-up will appear.\n\nPop-up for status Cancel: “Please update Closed/Cancellation Reason in service request detail for Cancelling the Service Request if there is no Job Card Created”\n\nJC Reopen\nBack to Annexure\nJob card Re-Opening after 30 days\n\nJob card Re-Opening after 30 days\nBack to Annexure\n\nJob card Re-Opening after 30 days\nBack to Annexure\nLogin with DSvM/ DSvAdv User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nJob card Re-Opening after 30 days\nBack to Annexure\n1. Active Position: DSvM/DSvAdv\n2. Click on Sitemap\n\nJob card Re-Opening after 30 days\nBack to Annexure\nClick on Job Card Approval Process\n\nJob card Re-Opening after 30 days\nBack to Annexure\nClick on Job Card Approval Process\n\nJob card Re-Opening after 30 days\nBack to Annexure\n1. Click on New Button\n2. Toggle to Details view\n\nJob card Re-Opening after 30 days\nBack to Annexure\n1. Select Approval Request Type as JC Re-open\n2. Select Chassis No from pick applet\n3. Select Job card # from pick applet\n\nJob card Re-Opening after 30 days\nBack to Annexure\nUser can Query with Chassis No, Registration No and pick\n\nJob card Re-Opening after 30 days\nBack to Annexure\nSelect Job Card # from pick applet\n\nJob card Re-Opening after 30 days\nBack to Annexure\nUser can Query with Chassis No, Order #, Status\nNote: Here all Job Card against the chassis # will be av"}, {"id": 28, "doc": "CVBU SERVICE KNOWLEDGE ARTICLE & FAQ DOCUMENT", "cat": "FAQ", "content": "CVBU Service Knowledge Article & FAQ Document\n\nBilling Category Selection.\nAns: For Billing category selection follow below path\nLogin with DSvAdv ID in Workshop >> Site Map >> Order >> Order List>> Query with JC# >> Click on JC# hyperlink >> Click on Performed Jobs view tab >> Select required Billing Category Account/Individual from Dropdown\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nCustomer GST# in Job Card  for B2B Case .\nAns: To enter GST# in JC follow below path:\nLogin with DSvAdv ID in Workshop >> Site Map >> Order >> Order List>> Query with JC# >> Click on JC# hyperlink >> Click on Performed Jobs view tab >> Enter Customer’s Active GST# if required\nNote:\nBefore entering GST# in JC, check GST# Status here: https://services.gst.gov.in/services/searchtp \nState Code of GST# should be the same as State maintained at address level of selected Billing Category\nThe GSTIN number must be in upper case with no special characters. It should be 15 characters where first 2 characters must be numeric\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nTax Category Selection.\nAns: For Tax category selection follow below path\nLogin with DSvAdv ID in Workshop >> Site Map >> Order >> Order List>> Query with JC# >> Click on JC# hyperlink >> Click on Performed Jobs view tab >> Select correct TAX Category\n\nNote: Tax Category should be selected as per the State maintained at address level of selected Billing Category. Do not to select Tax Category as per vehicle Registration number/state.\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nCheck Address of Billing Category: Account.\nAns: Login with DSvAdv ID in Workshop >> Site Map >> Order >> Order List>> Query with JC# >> Click on JC# hyperlink >> Click on Performed Jobs view tab >> Check the selected Billing Category (Account/Contact) >> One step back >> If Billing Category is Account click on Account hyperlink in JC list/line item view\n\n\n\n\n\n\n\n\n\nNow check the Address >> Address Line 1 is Mandatory >> In Address Line 2 is not required, but if maintained then minimum 3 character is required >> Pin Code is Mandatory >> Check the State\nNote: Based on this State user needs to select Tax Category and Customer GST# in job card.\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nAddress Update Process:  Check Account Rel. No. (ARN). If ARN is maintained against any Account you can not change any details.\nYou have to follow Service KYC Process to update address details. Refer “CVBU_Dlr_Service_KYC Process” manual.\nIf ARN is not maintained against any Account you can update address details.\nPath:  On this Account screen click on Activities view tab >> Click on Account Pick Applet >> Enter required address.\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nCheck Address of Billing Category: Individual.\nAns: Login with DSvAdv ID in Workshop >> Site Map >> Order >> Order List>> Query with JC# >> Click on JC# hyperlink >> Click on Performed Jobs view tab >> Check the selected Billing Category (Account/Contact) >> One step back >> If Billing Category is Contact click on Last Name hyperlink in JC list/line item view\n\n\n\n\n\n\n\n\n\nNow check the Address >> Address Line 1 is Mandatory >> In Address Line 2 is not required, but if maintained then minimum 3 character is required >> Pin Code is Mandatory >> Check the State\nNote: Based on this State user needs to select Tax Category and Customer GST# in job card.\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nAddress Update Process: Check Customer Rel. No. (CRN). If CRN is maintained against any Contact you can not change any details.\nYou have to follow Service KYC Process to update address details. Refer “CVBU_Dlr_Service_KYC Process” manual.\nIf CRN is not maintained against any Account you can update address details.\nPath:  On this Account screen click on Activities view tab >> Click on Account Pick Applet >> Enter required address.\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nCheck Job Value & Tax Calculation at Performed Jobs.\nAns: Login with DSvAdv ID in Workshop >> Site Map >> Order >> Order List>> Query with JC# >> Click on JC# hyperlink >> Click on Performed Jobs view tab >> Check “Job Entry Complete” flag is untick >> Do “Calculate Price–All Jobs” >> Check the Job Value and Tax Amounts\nIf Tax Category is sleeted at IGST at JC header level, then in performed jobs IGST amount will be calculated.\nIf Tax Category is sleeted at GST at JC header level, then in performed jobs CGST & SGST amounts will be calculated.\nIf you are updating any line item or field in Performed Jobs or changing  the Tax Category, mandatorily do “Calculate Price–All Jobs”\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nCheck Parts Amount & Tax Calculation at Job Card Parts.\nAns: Login with DPM ID in Workshop >> Site Map >> Order >> Order List>> Query with JC# >> Click on JC# hyperlink >> Click on Job Card Parts view tab >> Check “Parts Entry Complete” flag is untick >> Do “Get Price All” >> Check the Parts Amount & Tax Name\nIf Tax Category is sleeted at IGST at JC header level, then in JC Parts Tax Name will be IGST.\nIf Tax Category is sleeted at GST at JC header level, then in JC Pats Tax Name will be CGST/SGST.\nIf you are updating any line item or field in JC parts or updating the Tax Category, mandatorily do “Get Price All”.\nBasic Check Points User Needs To Check Before JC Closure/Invoicing\n\nCheck Invoice Flag against the Shipped Parts in Job Card.\nAns: For any part in JC parts section Invoice flag is automatically getting tickets. But user needs to check this before closing the JC. If the flag is blank for any shipped part, the same will not update in Invoice.\nLogin with DPM ID in Workshop >> Site Map >> Order >> Order List>> Query with JC# >> Click on JC# hyperlink >> Click on Job Card Parts view tab >> Check “Parts Entry Complete” flag is untick >> Ticket the Invoice Flag if it is blank for a"}, {"id": 29, "doc": "Activity", "cat": "General Process", "content": "CRM & DMS PROJECT\nActivity Creation\nCVBU Service\nLogin to the application with \nDSvCRO User ID & Password\n\nCRM & DMS PROJECT\nActivity Creation\nCVBU Service\nClick on \nSitemap\nClick on \nVehicles\n\nCRM & DMS PROJECT\nActivity Creation\nCVBU Service\nClick on \nVehicles\n\nCRM & DMS PROJECT\nActivity Creation\nCVBU Service\nSELECT LOST COUSTMER\n\nCRM & DMS PROJECT\nActivity Creation\nCVBU Service\nClick on \nContacts\n\nCRM & DMS PROJECT\nActivity Creation\nCVBU Service\nYou can get all the related \ncontact details of the customer\n\nCRM & DMS PROJECT\nActivity Creation\nCVBU Service\nHow to create an Activity\n\nCRM & DMS PROJECT\nActivity Creation\nCVBU Service\nClick on \nVehicles\nClick on All \nVisible Vehicles\nQuery with \nthe Chassis#\n\nCRM & DMS PROJECT\nActivity Creation\nCVBU Service\nClick on \nActivities\nClick on \nNew\nSelect the Category, \nComment, Description \nNote: After giving call to customer , if customer agrees to book the appointment for next service \ngo to Service Request view tab & create a new service request. Close the activity by selecting the status.\n\nCRM & DMS PROJECT\nActivity Creation\nPVBU Service\nActivity Handling\n\nCRM & DMS PROJECT\nActivity Creation\nPVBU Service\nClick on \nSitemap\nLogin as \nDSvCRO\n\nCRM & DMS PROJECT\nActivity Creation\nPVBU Service\nClick on \nActivities\n\nCRM & DMS PROJECT\nActivity Creation\nPVBU Service\nAgain Click \non Activities\n\nCRM & DMS PROJECT\nActivity Creation\nPVBU Service\nSelect the required \noption from PDQ\n\nCRM & DMS PROJECT\nActivity Creation\nPVBU Service\nData will be \ndisplayed as per the \nPDQ selected\n\nCRM & DMS PROJECT\nActivity Creation\nPVBU Service\nEnter proper \ncomment against \nthe activity\nEnter Actual Start Date \n& Actual End Date\nStatus will be \nchanged to Done\n\nCRM & DMS PROJECT\nActivity Creation\nPVBU Service"}, {"id": 30, "doc": "VEHICLE DETAIL AND SERVICE HISTORY", "cat": "Vehicle", "content": "PPT Name : CVBU_Dlr_Service_Vehicle detail check and Service_History_Process\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nVehicle Detail Check Process\nService History Check Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nCVBU Dealer Service Vehicle Details check and History Check Process\nBack to Annexure\nAll previous Services done to a vehicle is stored in application                   known as Service History.\n\n\nEnabling quick and systematic assessment for the Service Advisor by checking the previous services.\n\n\nEnabling the Top Management to analyze and identify the trends of services & issues coming  for the vehicle.\nBrief of CVBU Service History:\n\nBack to Annexure\nServicing ensures that parts that damaged are replaced.\n\nThis not only keeps them working but prevents their failure more seriously on other parts of the engine.\n\nUpdated Service History helps to check all the aspects.\n\nAn important benefit is that a full service history can add significant value to a used vehicle when it comes to be sold, as much as on the average vehicle.\nBenefits of CVBU Service History:\nCVBU Dealer Service Vehicle Details check and History Check Process\n\nCVBU Dealer Service Vehicle Details Check\n\nProcess Flow\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nLogin with DSvAdv / DSvM User ID & Password\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\n2. Click on Sitemap\n1. Active Position : DSvAdv/ DSvM\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nClick on Vehicles\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nClick on Tata Vehicles List\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nSelect All Visible Vehicles from dropdown\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nClick on Query button\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nQuery with Chassis number or Registration number\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nCheck Vehicle Information\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nCheck Service Information\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nCheck Aggregate Details\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\n1. Check Warranty Details\n2. Check Connected Vehicle Details\n\nBack to Annexure\nCVBU Dealer Service Vehicle Details Check Process\nCheck KYC Details\n\nCVBU Dealer Service Vehicle Service History Check\n\nProcess Flow\nBack to Annexure\nCVBU Dealer Service Vehicle Service History Check Process\n\nBack to Annexure\nCVBU Dealer Service Vehicle Service History Check Process\nLogin with DSvAdv / DSvM User ID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nCVBU Dealer Service Vehicle Service History Check Process\n2.Click On Site Map\n1. Active Position : DSvAdv/ DSvM\n\nCVBU Dealer Service Vehicle Service History Check Process\nClick On Vehicles\n\nCVBU Dealer Service Vehicle Service History Check Process\nClick On Tata Vehicles List\n\nBack to Annexure\nCVBU Dealer Service Vehicle Service History Check Process\nSelect All Visible Vehicles from dropdown\n\nBack to Annexure\nCVBU Dealer Service Vehicle Service History Check Process\nClick on Query button\n\nBack to Annexure\nCVBU Dealer Service Vehicle Service History Check Process\n]Query with Chassis number or Registration number\n\nBack to Annexure\nCVBU Dealer Service Vehicle Service History Check Process\nClick On Service History View Tab\n\nBack to Annexure\nCVBU Dealer Service Vehicle Service History Check Process\nHere is the list of Service History details for the chassis\n\nQue. Who Can Check Vehicle Details ?\nAns. DSvAdv, DSvM, DSvAdmn, DSvCRO can check the vehicle details.\n\nQue. On which screen/view Vehicle details will reflect?\nAns. User has to select “All Visible Vehicle” from drop down.\n\nQue. How to check Tyre and battery details of a vehicle?\nAns. After searching with the Chassis# user has to click on Show More button to check the details about Tyre and Battery under Aggregate details tab.\n\nQue. How to check previous Service Request details of a vehicle?\nAns. User has to click on Service History view tab to get the previous Service Request details against the vehicle.\n\nQue. What to do if any Service Request of any chassis# is not updated or reflecting?\nAns. User has to raise a REQ# with all details of Service Request like SR#, Chassis No., Service Type, Service KM and send it to the CRMDMS team.\nFAQ\n\nQue. What is the process if User is not having CRMDMS User Id?\nAns. The user must contact the System Admin of their organization who must raise a request in CRMDMS Support for CRMDMS User ID creation with required position and responsibility along with approval of their respective TSM/CSM of TML.  \nThe below excel is the User ID creation template in which user details must be filled along with required position and responsibility and a request should be raised to CRMDMS Support along with approval for User ID creation\nFAQ\n\nFor any issues, contact CRMDMS Support through the following channels\n\nRaise a ticket in system\nLogin to : https://itservicedesk.tatamotors.com/TataMotors/login-signin\nRefer attached User guide to raise a ticket.\n\n\n\nRefer the following opcats pertaining to Vehicle details and Service History check (Excel of Opcat)\n\n2. Call : 020-67136800\n3. Email : crmdms@tatamotors.com\nContact and Support"}, {"id": 31, "doc": "Service Mobility Bandhu Apps", "cat": "Mobility Apps", "content": "Bandhu App UI-UX Revamp and feature enhancements\nSplash Screen\nOne Time Registration\nLogin\nDashboard\nSplash Screen\nRegistration Screens\nBandhu\n\nBandhu App UI-UX Revamp and feature enhancements\nLogin\nDashboard\nLogin Screens\nBandhu\nDashboard Screens\n\nBandhu App UI-UX Revamp and feature enhancements\nNavigation\nProfile\nBandhu\nNavigation\nProfile\n\nBandhu App UI-UX Revamp and feature enhancements\nJob Card Creation\nBandhu\nJob Card Creation\n\nBandhu App UI-UX Revamp and feature enhancements\nJob Card Creation\nBandhu\nJob Card Creation\n\nBandhu App UI-UX Revamp and feature enhancements\nJob Card Creation\nBandhu\nJob Card Creation\n\nBandhu App UI-UX Revamp and feature enhancements\nJob Card Creation\nEstimates\nBandhu\nJob Card Creation\n\nBandhu App UI-UX Revamp and feature enhancements\nJob Card Creation\nBills\nBandhu\nJob Card Creation\n\nBandhu App UI-UX Revamp and feature enhancements\nJob Card Creation\nPayments\nBandhu\nJob Card Creation\n\nBandhu App UI-UX Revamp and feature enhancements\nMy Jobs\nFinance \nIncome\nBandhu\nMy Jobs, Finance, Income\n\nBandhu App UI-UX Revamp and feature enhancements\nCommunity\nBandhu\nCommunity\n\nBandhu App UI-UX Revamp and feature enhancements\nTraining\nBandhu\nTraining\n\nBandhu App UI-UX Revamp and feature enhancements\nOthers\nBandhu\nMiscellaneous"}, {"id": 32, "doc": "Service Master Linkage Process", "cat": "General Process", "content": "Overview\nPosition & Responsibility for the Process\nCRM Process for Service Master Linkage\nIn this course we will learn :\nCustomer Complaint Master\nFail Code Master\nService Master Linkage\n\nOverview\nPosition & Responsibility for the Process\nCRM Process for Service Master Linkage\nCustomer Complaint Master\nFail Code Master\nService Master Linkage\n\nClick on customer complaints master/\nfail code master/\nservice master linkage\n\nNote: You can query for any Fail Code also from here. In that case you need to enter fail code in the “Fail Code” field after clicking on the Query button.\nVarious Fail codes where Fail type = “CARS”\n\nCustomer Complaint Code\nRelated Fail Code\nRelated Job Code\n\nWe can also query for a particular Complaint Code\n\nFail Code and Job Code pertaining to Complaint Code=X1\n\nWe can also \nquery job code of a\n particular Parent Product Line"}, {"id": 33, "doc": "Service Reminder", "cat": "Service Reminder", "content": "Logic of Next Service Date\nHow to query Service Reminder list\nIn this course we will learn :\nOverview\nHow to check Contact details\nHow to create a Service Reminder activity\nHow to reassign Activity\nHow to create Service Booking\n\nOverview\nCalls made to inform the customer about their next service due\nPrior appointment booking to the customer for service\nGenerate revenue for workshop\nIncrease vehicle inflow\nImproved customer loyalty\n\nNew Vehicle Logic: \nA program runs everyday in the night for all the vehicles sold 1 day back and stamps the NSD based on the 1st free service period pertaining to the corresponding PPL.\nJC Closed Logic: \nOnly job cards having “Complaint Code” as SSC & “Job Code” is either Free1or Free2 or Free3 or Free4 or Free5 will qualify for NSD stamping. Program which runs daily checks for JC closed 1 day back will do the stamping for such cases\n\nLogin to the \napplication \nwith user ID \nand password\n\nLogin as DSvCRO\nClick on Sitemap\nClick on Vehicles\n\nSelect  ‘Service Reminder \nfor (8-10 days) in advance’  in Saved Query\n\nUser can check the Next \nService Date\nClick to check details for next chassis\nNext Service date prompted by the system\n\nCRO calls the customer to seek his/her convenient date for service.\nUser can get all the related \ncontact details of the customer\n\nClick on Activities view tab\nClick on New\nNote: Booking receptionist calls the customer to seek his/her convenient date for service \nAfter call to customer , if customer agrees to book the appointment for next service create a new service request\nSelect the Activity Type as ‘Service Reminder Analysis’\nMention Comments/ Feedback if any\n\nChange status to Closed\nNote: Activity Status to be CLOSED only if Customer agrees for a service booking.\n\nRole of CRM in Service Reminder\nCheck activities assign to him/her for approval. Activity Status as “Pending for Approval.\n2. Understand whether it’s a product related issue or non product issue or demand related from comments column\n5. Follow up with all “Approved” activities to check whether CRO contacted.\n3.  Take decision what to offer to customer based on:\na.  Customer location is nearby to dealership or far away from dealership\nb.  Customer service history & total revenue generated from his vehicle in past services\nc.  Calculate the projected revenue through coming service\n4. Inform CRO about the approval & change the status of activity to “Approved” & record the same in “Description Column”\n\nClick on Service Requests view tab\nClick on New\nSelect Source as ‘Service Reminder Analysis’\nSelect Service Type\nSelect Booking date & time\nSelect Assigned To\nSummary if any\nNote: Service request to be assigned to the Service advisor who will be attending the customer.\nSystem generated SMS is triggered at 7:30 pm one day prior to the booking date as a reminder to the customer"}, {"id": 34, "doc": "JOB CARD OPENING", "cat": "Job Card", "content": "PPT Name : CVBU_Dlr_Service_JC_Opening_Process\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nJC opening process\nBIP Reports\nFrequently Asked Questions (FAQ)\nContact & Support\nBack to Annexure\n\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\nRoles Required\nBack to Annexure\n\nThe JC opening contains the following broad level processes\nClose Job Card\nService Request\nJob Entry\nPick Parts\nShip Parts\nJob Card\nSpares\nParts Entry\nService Vehicle\nPayment\nProcess Flow\nBack to Annexure\n\nProcess Flow\nProcess Flow\nBack to Annexure\n\nLogin with DSvAdv User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nJC Opening - Login\nBack to Annexure\n\nActive Position : DSvAdv\nClick on Sitemap\nJC Opening – Service Request Creation\nBack to Annexure\n\nClick on Service Request\nJC Opening – Service Request Creation\nBack to Annexure\n\nClick on Service Request\nJC Opening – Service Request Creation\nBack to Annexure\n\nClick My Service Request (CVBU).\nJC Opening – Service Request Creation\nBack to Annexure\n\n1.Enter Registration No.\n2.Click on Go\nJC Opening – Service Request Creation\nBack to Annexure\n\nToggle to Service Request Detail\nJC Opening – Service Request Creation\nBack to Annexure\n\n2.Click on Chassis No. Pick applet\n3. Query with Chassis No.#\nJC Opening – Service Request Creation\n1.Click on New(+)\nNote: Before selecting Chassis, please refer PPT: “CVBU_Dlr_Service_Vehicle detail check and Service_History_Process” / “CVBU_Dlr_Service_Warranty & AMC_Details_Checking_Process” for Vehicle related Information.\nBack to Annexure\n\nClick on OK to select Chassis\nJC Opening – Service Request Creation\nBack to Annexure\n\n1.Select Service Type from dropdown\n2. Enter Operation, Road Type\n3. Select SA Attended Date\nJC Opening – Service Request Creation\nNote: SA Attended Date is mandate field for Service Type: Free Service\nBack to Annexure\n\nJC Opening – Service Request Creation\nService-Type : Depending on the nature of service type of service should be selected from the available drop down. Some important service types are as follows:\u000b\nPDI:- This is selected when a vehicle get serviced before delivery to customer\u000b\nFirst/Second/Third Free Service:- This service type should be selected when vehicles comes for 1st free service. For other free services also we have service types like Second Free Service, Third Free Service, Fourth Free Service etc.\u000b\nPaid Service:- When customer use to pay for the service done in his/her vehicle then we should select the service type as Paid Service\u000b\nWarranty:- This service type should be selected when vehicles comes in the workshop within Warranty date.\n\nGoodwill:- This service type should be selected when TML gets goodwill claim for any of the valuable customer and for generating Goodwill claim Service type only select as Goodwill.\nBack to Annexure\n\nJC Opening – Service Request Creation\nSpare Part Warranty:- If any part associate under paid and if the parts warranty is not expired then this service type should be selected for claiming warranty.\n\nAMC-TM:- In case the vehicle is getting serviced under AMC then this service type is used.\n\nFMS-TM:- In case the vehicle is getting serviced under FMS then this service type is used.\n\nVLTD Fitment:- VLTD Stands for Vehicle Location Tracking Device. In case Fleetedge device purchased from customer through Fleetedge portal a Service request will created automatically in CRM and System will not allow to create Service Request manually with service type “VLTD Fitment” in CRM.\nBack to Annexure\n\nAfter entering SA attended date, if vehicle is connected vehicle then Connected KM button will get activated\nJC Opening – Service Request Creation\nBack to Annexure\nNotes: Three New fields and one button has been introduced service request to capture Connected Vehicle KM -\nConnected KM, \nConnected KM Status \nConnected KM Comments.\n\nClick on Connected KM button to get Connected KM Status, Connected KM Comment and Connected KM\nJC Opening – Service Request Creation\nBack to Annexure\nUser has to click on Connected KM button to fetch Connected KM reading from Fleetedge. In case of Successful response, KM reading will be fetched from Fleetedge and same get updated in “Connected KM” field & “Connected KM Status” will be updated as “Success” along with “Connected KM Comment” field.\n\nClick on Connected KM button to get Connected KM Status, Connected KM Comment and Connected KM\nJC Opening – Service Request Creation\nBack to Annexure\nUser has to click on Connected KM button to fetch Connected KM reading from Fleetedge. In case of Failure response, “Connected KM” reading will not be received from Fleetedge & “Connected KM Status” will be updated as “Failure” along with “Connected KM Comment” field as “No Data Found”.\n\n1.Select Labour Rate List\n1. Select Labour Rate List\n2. Select Parts Price List\n3. Enter Current KMs\n4. Ctrl+S\nJC Opening – Service Request Creation\nBack to Annexure\n4. Enter Hours for Tipper Vehicles\n\nJC Opening – Service Request Creation\nNotes:\nWhile picking chassis in SR, Insurance Agent details will be updated at SR level automatically from vehicle level.\n \nIf Vehicle Category is ‘Tata Kavach’ then Insurance Agency should be TMI to forward Penalty request at Next level for Approval\n \nIf Insurance Expiry date is >= Job card created date and Insurance Agent = TMI then only dealers will be able to forward Kavach Penalty Requests.\n \nFor Non TMI or blank Insurance Agency cases, Tata Kavach Penalty will not be applicable.\n \nIf Insurance expiry date is prior to JC created date or Insurance Agent is blank .Non- TMI then system will not allowed Service advisor to forward request to next level.\nTMI Details at SR level\nBack to Annexure\n\nBack to Annexure\nJC Opening – Service Request Creation\nNotes:\n“Zippy” status will be tagged in vehicle category based on below logic:\nSCV - 2 years and 72000 KMs\nSC-Pass (Winger) - 3 Years or 3, 00,00"}, {"id": 35, "doc": "VAS WEB PORTAL", "cat": "VAS Portal", "content": "Value Added Service (VAS) Portal\nPranav Belwalkar  I Date: 29/ 12/ 2025\nDealer Process - User Manual\n\nAgenda/ Table of Content\nVAS Overview\nProcess Flow: AMC Order Booking – Scheme / NFA / Paid Booking\nApplication Walkthrough\n\nValue Added Service (VAS) Portal\n4\nWhy VAS Portal?\nThe mention portal is for Tata Motors CV Business unit to book the Value Added Services products to end customers through new portal. \nTata Motors intends to offer purchase of multiple products viz AMC, Extended Warranty, FMS, and Roadside Assistance to customers. The current portal is live with AMC \nThis new edge portal has better UI; concept of VAS pipeline for tracking orders; E-kyc for customer code creation, Digital CIF acceptance, Group Order creation & processing Interface to interact with TMLGSL team etc. This help in reducing the order booking TAT, and better customer experience.\nWhere to access?\nPortal will be access Desktop portal link: https://vas.cv.tatamotors.com/\nWho will have access?\nThe portal can access by Siebel CRM user-id & password \nSale Role: DSE (Dealer Sales Executive), DSM (Dealer Sales Manager), DSAdmn (Dealer Sales Admin)\nService Role: DSvAdv(Dealer Service Advisor), DSvM (Dealer Service Manager), DSvAdmn ( Dealer Service Admin)\nAll the roles have provision to book the VAS Orders end-to-end based on the privileges provided\n\n2\nProcess Flow: AMC Order Booking – Scheme / NFA / Paid Booking\n\nProcess – Scheme / NFA / Paid\nThe booking flow for Scheme/ Campaign/ NFA and Paid AMC order is same once order is created i.e KYC-Customer code creation  Payment & Contract Creation  CIF acceptance/ verification & contract activation\n\nDealer Portal\n8\nSign In\n\nThe user must:\nOpen the portal URL - https://vas.cv.tatamotors.com/ in any web browser  \nEnter the designated Siebel CRM Username and CRM Password.\nClick the “Login” button to proceed.\n\nVAS Pipeline\n9\nDetails of  VAS Opty/ Order Pipeline\n\nVAS pipeline stages: The VAS pipeline consist of 4 stages A0, A1, A2, A3 and A4. The other stages lost and cancel opportunities\nCRM Position: The active position through which user can see the order \nDownload the order report and Refresh the pipeline\nUser Profile: Change the dealer position against the given CRM-ID\nVAS Order redirection\nSearch option based on Chassis Number, opty etc\nFiltering order based status\nComplete pipeline Order Report \nDetails of Contract booked through VAS portal\nEvent log: Shows the order aging and reverse sequence of order event\n\nVAS Sale pipeline process flow\n11\nDigital CIF acceptance link triggered to customer\nManual CIF Booking Team verification done by Booking team\nCustomer showing interest in purchasing VAS through E-guru/ FleetVerse\nCampaign tagging against vehicle opty \n[C0-C1A]*\nNFA AMC Requested against vehicle opty \n[C0-C1A]*\nInterest in VAS & C2*\nAdvance payment through FleetVerse\nCampaign tagging against vehicle opty \n[C2]*\nNFA AMC Approved against vehicle opty \n[C2]*\nAuto Order Creation (post retail)\nE-kyc verification of PAN and GSTN through Karzai API\nMDM team verify the document\nE-kyc Failure document send for manual verification\nCustomer showing interest in purchasing VAS through E-guru/ FleetVerse\nCustomer Code creation in SAP\nContract activation & Invoicing\nDigital CIF acceptance fails/ customer didn’t opted for digital\nDigital CIF Accepted through OTP verification\nLinked through CRMDMS Solr\nOld vehicle customer can visit Fleetverse/ dealer to create order for required VINs\nProduction selection for NFA and paid VAS\nPayment made to TML\n*C0, C1, C1A,C2 & C3 vehicle opportunity sale stages\n\nVAS Order Booking: Campaign; NFA; Paid Orders  (1 of 3)\n12\nCampaign Order:\nAMC Campaign are tagged during the vehicle sale journey and auto orders are created post vehicle retail.\nThe product for campaign is predefine & cannot be changed \n\nNFA AMC Order:\nNFA AMC is raised and approved during the vehicle sale journey\nThe NFA AMC approved amount will be  shown\nThe product needs to be selected after auto order is created post vehicle retailed\n\nPaid Case: \nPaid AMC can be purchased post retail where is chassis is allocated\nThe product selection needs to done on order screen and no auto order will be created.\n\nVAS Order Booking: Campaign; NFA; Paid Orders Continue… (2 of 3)\n13\nAMC Order Booking:\n\nSelecting chassis against which AMC is to be purchases \nDownload & Upload chassis in
