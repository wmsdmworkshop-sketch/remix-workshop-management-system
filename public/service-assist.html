bulk\nProduct Selection: Application, Terrain, validity km, period service type to be selected which will be common for all the chassis selected\nGet more details on Service category\nTotal product price including taxes\n\nVAS Order Booking: Campaign; NFA; Paid Orders Continue… (3 of 3)\n14\nAMC Order Booking Continued...\n\n6. Sale Manager Selection\n7. Sale executive selection\n8. Final Order creation (paid cases)\n6\n7\n8\nNOTE: The DSE/ DSM selected cannot be changed once order is created and same will be subject to avail dealer commission incentive\n\nVAS Quote Creation (1 of 2)\n15\nAMC Quotation Sharing\n\nView Quote: The option is view quote for the opportunity/ order generated.\nSharing Quote Through Email & Whatsapp\n1\n2\n\nVAS Quote Creation (2 of 2)\n16\nAMC Quotation Sharing – End Customer View\n\nEmail will be send to end customer through Tata motor’s registered email id noreplyFleetCare@tatamotors.com \nWhatsApp message will be triggered from the Tata Motors registered mobile number “XXXX”\n1\n2\n\nKYC and Customer Code Creation (1 of 3)\n17\nE-KYC and Customer Code Creation\nPersonal details: Personal details of the customer should be as per government record i.e the customer name company should be as PAN and GST as applicable\nProvision to Change Address: Customer’s address and invoices will be generated against the same address\nProvision to Change GST: The customer’s GST can be changed and will undergo KYC verification\nGet Customer Code: If customer has purchase AMC in past the system will fetch customer code\n\nKYC and Customer Code Creation (2 of 3)\n18\nE-KYC failure and Physical KYC\n\nE-KYC failure: For ekyc failure case clear scanne"}, {"id": 36, "doc": "JOB CARD DUAL INVOICING FOR INSURANCE", "cat": "Job Card", "content": "PPT Name : CVBU_Dlr_Service_JC_Dual_Invoicing_Insurance_Process\nProcess :\nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nDual Invoice Insurance JC Process\nBIP Reports\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : \thttps://crmsdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nIntroduction\nProvision for dealers to generate separate invoice for Insurance Company using Claim Module and capture the Depreciation  & Liability details at job card Level and other invoices in CRMDMS application in accordance with GST guidelines and E-Invoice. \nChanges would be common and applicable for both CV and PV Insurance Claims.\n\nProforma e-invoice insurance copy is also made available at the insurance claim to apprise the insurance company before submitting the final invoice copy. \n\nThe insurance e-invoice copy can be downloaded once you drill down to insurance invoice view.\nIf the dealer belongs to 100 crore category and IRN details are received in CRM from IRP, only then invoice should be downloaded else the report won’t be printed.\n\nThree buttons will be introduced and will be integrated with IRP portal for implementing IRN functionality.\nGenerate IRN (For generating the IRN against the CRM Invoice)\nFetch IRN (For fetching the IRN against the CRM Invoice)\nCancel IRN (For cancelling the IRN against the CRM Invoice)\nAs Insurance claim is always B2B, hence only IRN checks are required where IRN and QR code will be printed on Insurance Invoice\n\nInsurance Account Creation\nBack to Annexure\nDealer can create New Insurance company from Accounts Screen if the Insurance Company is not available under Service Request Screen( Refer next slide for details)\nEnter all the Mandatory details. Under Site Name give “State Code – State Name” . The Site will come as Place of Supply under Insurance Claim Report which will get generated from Insurance Claims Screen.\nClick on + button to Create New Account and Click Cancel.\nChange the Account type as Insurance . Accounts having type with Insurance will only available under Insurance Pick Applet in Service Request Screen . Once the Account type is changed to Insurance then the Account Applet will become read only and Dealer cannot change any details against the same.\n\nBack to Annexure\n1. The Insurance Company name field in Service Request level will be “Pick Applet” in which Name of Insurance company, Address and GSTIN will come for Insurance company\n\nBack to Annexure\nWhen user will click pick applet of The Insurance Company name field in Service Request level, a pick applet (Pop up window) will open to choose the Insurance company.\n\nOnly those Insurance company accounts will be displayed in pick-applet which have “Account type” = Insurance. Hence dealer should create all the Insurance company accounts from their respective States with proper address and GSTN for the same and Change the Account Type to “Insurance” as shown below.\nNew Account Type Insurance can be created under accounts by dealer.\nAddress and GSTIN of the account will be mandatory for creating Insurance account.\nIf the same GSTIN details are provided by the dealer for any other Insurance company then pop-up for duplicate GSTIN will appear.\nOnce the Account Type is changed to “Insurance” all fields except Account Type will become read only. All those fields should again become editable once account type is changed to Not Specified.\nThe Account can be changed from Insurance to Not Specified only by RCCMs\n\nPicking Insurance account in SR Level:\nBack to Annexure\nClick on the Insurance Co pick applet in the SR level\nIn the Pick Applet, search with the GSTIN for the Insurance Co\nNote: If not found, pls go to Accounts and create an Account for the same\nIf the INS company account is displayed, pls select the same\nNote: If desired account is not found, Click on the + button to create an Account\n\nAdding Jobs in Performed jobs with billing type : Insurance\nBack to Annexure\nAdditional fields in Performed Jobs level has been introduced. For every Job line level, the new fields introduced are “Depreciation %” and “Insurance Liability Amount”\nNote: For Jobs \n \nDepreciation % field is mandatory and editable only where the billing type = INSURANCE\nNew Net Job Price  (Customer Liability) = (Job Value - Concession + Extra Charge) X (Depreciation%)\nInsurance Liability amount = (100% - Depreciation%) X (Job Value - Concession + Extra Charge)\nGST will be calculated based on “Net Job Price” and will be applicable only in customer invoice\n\nAdding Parts in JobCard Parts with Type : Insurance\nBack to Annexure\nAdditional fields in Parts level has been introduced. For every Parts line level, the new fields introduced are      “Depreciation %” and “Insurance Liability Amount”\nNote: For Parts \n \nDepreciation % field is mandatory and editable only where the billing type = INSURANCE\nNew Line Total  (Customer Liability) = [(Rate X Qty) – (Discount X Qty)] X (Depreciation%)\nInsurance Liability amount = (100% - Depreciation%) X [(Rate X Qty) – (Discount X Qty)]\nGST will be calculated based on “Line Total” and will be applicable only in customer invoice\n\nJob Card Invoice\nBack to Annexure\nCustomer Invoice can be created in the same process as it is today from Job Card Invoice Tab. \nIn the customer invoice, for Insurance billing type only, “Insurance Liability %” value will be populated.\nCustomer liability amount (Total Amt incl. Taxes) will appear based on Depreciation%\nIn this invoice, GSTN of only customer will come (If applicable)\n\nInsurance Claim Invoice Generation in VCM Claims\nBack to Annexure\nA separate claim screen under “VCM Claims” as “Insurance Claim” has been created. Dealers need to query with the JC number and fill up the rest of the details. The Job card will be visible in this screens only when dealer clicks on “generate Claim” button after closure of the JC \nClicking on “Fetch Details” will fetch the Labour & Par"}];

// ── SEARCH ENGINE ──
function tokenize(str) {
  return str.toLowerCase().replace(/[^a-z0-9\s\/]/g, ' ').split(/\s+/).filter(t => t.length > 1);
}

function scoreDoc(tokens, doc) {
  const haystack = (doc.doc + ' ' + doc.cat + ' ' + doc.content).toLowerCase();
  let score = 0;
  let matchedTokens = new Set();
  for (const t of tokens) {
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
    const matches = (haystack.match(re) || []).length;
    if (matches > 0) {
      score += matches * (doc.doc.toLowerCase().includes(t) ? 4 : 1);
      matchedTokens.add(t);
    }
  }
  // bonus if all tokens match
  if (matchedTokens.size === tokens.length && tokens.length > 1) score *= 1.6;
  return { score, matchedTokens };
}

function search(query) {
  const tokens = tokenize(query);
  if (!tokens.length) return [];
  const results = [];
  for (const doc of KB_RAW) {
    const { score, matchedTokens } = scoreDoc(tokens, doc);
    if (score > 0) results.push({ doc, score, matchedTokens });
  }
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 12);
}

// ── RENDER HELPERS ──
function highlight(text, matchedTokens) {
  if (!matchedTokens || matchedTokens.size === 0) return escHtml(text);
  let result = escHtml(text);
  for (const t of matchedTokens) {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    result = result.replace(re, '<span class="highlight">$1</span>');
  }
  return result;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function extractPaths(content) {
  // Find navigation paths in the document
  const pathRegex = /(?:Login[^>]*>>|Sitemap[^>]*>>|Site Map[^>]*>>)[^\n]{10,}/gi;
  return [...content.matchAll(pathRegex)].map(m => m[0].trim()).slice(0, 3);
}

function extractNotes(content) {
  const noteRegex = /Note:\s*([^\n]{20,})/gi;
  return [...content.matchAll(noteRegex)].map(m => m[1].trim()).slice(0, 2);
}

function formatPath(pathStr) {
  const parts = pathStr.split('>>').map(p => p.trim()).filter(Boolean);
  return parts.map((p, i) =>
    (i < parts.length - 1)
      ? `<span>${escHtml(p)}</span><span class="path-sep"> » </span>`
      : `<span>${escHtml(p)}</span>`
  ).join('');
}

function renderExcerpt(content, matchedTokens, maxLen = 350) {
  // Find best snippet around a match
  const lower = content.toLowerCase();
  let bestIdx = 0;
  for (const t of matchedTokens) {
    const idx = lower.indexOf(t);
    if (idx > 0) { bestIdx = Math.max(0, idx - 80); break; }
  }
  let snippet = content.slice(bestIdx, bestIdx + maxLen);
  if (bestIdx > 0) snippet = '…' + snippet;
  if (bestIdx + maxLen < content.length) snippet += '…';
  return highlight(snippet, matchedTokens);
}

function renderCard(item, idx) {
  const { doc, score, matchedTokens } = item;
  const paths = extractPaths(doc.content);
  const notes = extractNotes(doc.content);
  const excerpt = renderExcerpt(doc.content, matchedTokens);
  const catColor = CAT_COLOR[doc.cat] || '#374151';

  const pathsHtml = paths.map(p => `
    <div class="path-block">
      <div class="path-label">Navigation Path</div>
      <div class="path-text">${formatPath(p)}</div>
    </div>`).join('');

  const notesHtml = notes.slice(0, 1).map(n => `
    <div class="note-block"><strong>Note</strong>${escHtml(n)}</div>`).join('');

  return `
  <div class="card" id="card-${idx}">
    <div class="card-header" onclick="toggleCard(${idx})">
      <span class="card-cat-badge" style="background:${catColor}22;color:${catColor}">${escHtml(doc.cat)}</span>
      <div class="card-title">${escHtml(doc.doc)}</div>
      <svg class="card-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="card-body">
      <p class="card-excerpt">${excerpt}</p>
      ${pathsHtml}
      ${notesHtml}
      <div class="card-source">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Source: ${escHtml(doc.doc)}
      </div>
    </div>
  </div>`;
}

function toggleCard(idx) {
  const card = document.getElementById('card-' + idx);
  card.classList.toggle('open');
}

// ── SIDEBAR ──
function buildSidebar() {
  const cats = {};
  for (const doc of KB_RAW) {
    cats[doc.cat] = (cats[doc.cat] || 0) + 1;
  }
  const sorted = Object.entries(cats).sort((a,b) => b[1] - a[1]);
  const sb = document.getElementById('sidebar');
  let html = `<div class="sidebar-label">Browse Topics</div>`;
  html += `<button class="sidebar-btn active" onclick="filterCat(null, this)"><span class="dot"></span>All Topics<span class="sidebar-count">${KB_RAW.length}</span></button>`;
  for (const [cat, count] of sorted) {
    html += `<button class="sidebar-btn" onclick="filterCat('${cat.replace(/'/g,"\\'")}', this)"><span class="dot"></span>${cat}<span class="sidebar-count">${count}</span></button>`;
  }
  sb.innerHTML = html;
}

let currentCat = null;
function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const q = document.getElementById('searchInput').value.trim();
  if (q) { doSearch(q); } else { showWelcome(); }
}

// ── WELCOME ──
function showWelcome() {
  document.getElementById('statusBar').style.display = 'none';
  document.getElementById('results').innerHTML = '';
  const filtered = currentCat ? QUICK.filter(q => q.cat === currentCat) : QUICK;
  const cards = (filtered.length ? filtered : QUICK).map(q => `
    <button class="quick-card" onclick="setQuery('${q.q.replace(/'/g,"\\'")}')">
      <div class="quick-card-cat">${q.cat}</div>
      <div class="quick-card-q">${q.q}</div>
    </button>`).join('');
  document.getElementById('welcome').innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">🔧</div>
      <h2>CVBU Dealer Service Knowledge Base</h2>
      <p>Search across ${KB_RAW.length} process guides covering Job Cards, Warranty, AMC, CPSC, and more.</p>
      <div class="quick-grid">${cards}</div>
    </div>
    ${CONTACT_HTML}`;
}

// ── SEARCH ──
function doSearch(query) {
  let results = search(query);
  if (currentCat) results = results.filter(r => r.doc.cat === currentCat);
  document.getElementById('welcome').innerHTML = '';
  const statusBar = document.getElementById('statusBar');
  const resultCount = document.getElementById('resultCount');
  statusBar.style.display = 'flex';
  if (results.length === 0) {
    resultCount.innerHTML = 'No results found';
    document.getElementById('results').innerHTML = `
      <div class="card" style="padding:24px 20px; text-align:center;">
        <p style="color:var(--text2); font-size:.9rem; margin-bottom:8px;">No matches found for "<strong>${escHtml(query)}</strong>"</p>
        <p style="color:var(--text3); font-size:.82rem;">Try different keywords, or contact CRMDMS support below.</p>
      </div>
      ${CONTACT_HTML}`;
    return;
  }
  resultCount.innerHTML = `<span>${results.length}</span> result${results.length !== 1 ? 's' : ''} for "${escHtml(query)}"`;
  // auto-open first result
  const cardsHtml = results.map((r, i) => renderCard(r, i)).join('');
  document.getElementById('results').innerHTML = cardsHtml + CONTACT_HTML;
  // open first card
  document.getElementById('card-0')?.classList.add('open');
}

function setQuery(q) {
  const inp = document.getElementById('searchInput');
  inp.value = q;
  inp.dispatchEvent(new Event('input'));
  inp.focus();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('visible');
  showWelcome();
}

// ── EVENT WIRING ──
let debounceTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.trim();
  document.getElementById('clearBtn').classList.toggle('visible', q.length > 0);
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    if (q.length < 2) { showWelcome(); return; }
    doSearch(q);
  }, 200);
});

buildSidebar();
showWelcome();
</script>
