const KB_RAW = [{"id": 0, "doc": "CPSC 3.0 Training Presentation", "cat": "CPSC Scorecard", "content": "Title\nCPSC 3.0\nParameters Discussion\nDate – 24/05/2018\n\nCPSC 3.0 Salient Points\nNumber of Parameters have been reduced from 17 to 16\n\nSales and Service Points Distribution is at 50 : 50 vis a vis 68 : 32 in CPSC 2.7\n\nCPSC scores will be released by 3rd of every month (need conformation from CRMDMS team on data quality)\n\n13 of the 16 CPSC parameters scoring will be drawn from CRMDMS. The Balance 3 to be manual with a thorough audit\n\nCPSC parameters is in line with the profitability initiatives (more than 70% covered)\n\nBSC vs CPSC 3.0\nCV CC BSC\nDealer CPSC 3.0\nCV S&M BSC\n18\n17\n16\n\nCPSC 3.0 Proposed Link to Dealership Profitability Initiative\nIncluded in CPSC 5.0\n\nCPSC 3.0 Proposed Link to Dealership Profitability Initiative\n\nThere is no change in the CPSC payout tiers / slabs . The payout calculation methodology shall be on  basis above criteria\n\nNote : The Parameters will be calculated based on data available with SHQ. There will be no changes accepted after the cutoff date for changes has passed.\nCPSC 3.0 : Payout Slab Structure\n\nTo receive payout, Dealer will need to have minimum defined scores in following parameters to be eligible for a Payout:\n\nBS VI Readiness and Infrastructure Audit Adherence - 100% Compliance \nSSI Calling scores of 70% and above\n\nImportant Note : \nBS VI Readiness and Infrastructure Audit Adherence parameter will be evaluated during Q4 \nIn Case of Non-Adherence to the above, there will be Zero payouts for the financial year \nIn Case Q1 to Q3 payouts have been released than in case of non-compliance, TML will raise debit notes of the same amount for the last 3 quarters payouts\n\nIn case SSI Scores are not above 70%, the Payout for the month in Question will be Zero.\nCPSC 3.0 : Qualifying Criteria for Payouts\n\nF1) Achievement % for Sales Volume Offtake \t\t\t\t\t\t\tTotal Points - 50\n\nTo be calculated PL wise for the following PL’s - M&HCV, ILCV, SCV, CV Pass \n\nOfftake for the current month will be net of cancellations. STU Sales will not be considered in Target & Actuals. Govt. sales will be considered in the target and actuals\n\nTotal Points will be equally distributed across all applicable PL’s.\n\nT1 targets will be considered. Fixed on monthly basis by State Office\n\nIf Achievement =100% - 12.5 points for PL\nIf 100%> Achievement >=90% - 6.25 points for PL\nElse Zero points\n\nCalculation : \n\n\nNote 1 : No change in Targets will be allowed during the course of the month once the Targets are updated in the system\nNote 2 : Final Score for parameter will be Aggregate of all mandate PLs \nNote 3 : If applicable PL is only 1 than extrapolation will be on the basis of the score in the applicable PL\nCPSC 3.0 Parameters\n\nF2) Working Capital \t\t\t\t\t\t\t\t\tTotal Points - 50\n\nThis Calculation will be at the Dealer level\n\nCalculation Methodology :\nDealer availing up to 7 days of sales as deferred credits, 50 points\nDealer availing maximum of 15 days of sales as deferred credits, 25 points\nElse, Zero Points\n\nNote 1 : Target Fixed (7 days).  Dealership responsibility is to keep the credit under the limit based on the offtake they expect to do during the month. Till further notice, calculation will be based on the amount outstanding at the end of the month.\nNote 3: Subject to dealer giving a self-certification of all VME and FME claims being raised on line pertaining to N-2 month – \n      else score will be zero\nCPSC 3.0 Parameters\nExample 1 :\nOfftake amount of Dealership – 30 Crores, Offtake amount per day – 30/30 = 1 Crores. Working Capital Limit – 1*7 = 7 Crores\nAmount of Credit in Number of Days based on Offtake Amount of the Month\nExample on VME Claims: CPSC score for April is 50 for this parameter. The qualifying criteria will be the clear confirmation of all claims raised for the month of February, are completed by 30th April and letter confirming the same is given by the dealer\n\nF3) De-risk dealer business from cyclicality by focusing on Parts \t\t\t\t\tTotal Points - 75\n\nThis Calculation will be at the Dealer level\n\nIf Achievement =100% - 75 points\nElse if 100%> achievement >=95%, 50 Points\nIf 95%> Achievement >=90% - 35 points\n\nElse Zero points\n\nCalculation : \n\n\nNote 1 : Source of supply could be dealer or/and distributor \nNote 2 : The Actual Part Offtake Value has to be without Tax\nCPSC 3.0 Parameters\nExample :\n\nF4) De-risk dealer business from cyclicality by focusing on Value added services\t\t\tTotal Points - 50\n\nThis Calculation will be done at Dealership Level\n\n VAS factors to be considered are: \nTata OK penetration\nAMC penetration\n\nMaximum Points of each VAS:\nTata OK – 30\nAMC – 20\nCalculation:\nCPSC 3.0 Parameters\n\nF4) De-risk dealer business from cyclicality by focusing on Value added services (continued)\n\nPoints Slab for Each VAS are: \n\nTata OK penetration\nIf SCV Achievement % >=20% , 10 Points\nIf (ILMHCV) Achievement % >=7%, 10 Points\nIf Certified % >= 25% , 10 Points \nElse Zero points\n\nAMC penetration\nIf achievement % >= Target% in table below, 5 points for PL\nElse Zero points\nNote 2 : Total Points will be equally distributed across all applicable PL’s\nCPSC 3.0 Parameters\n\nC1) Drive Customer Sales Satisfaction\t\t\t\t\t\t\t\tTotal Points - 50\n\nSales Experience Score of Dealership is based on CBSL calling\nRetail Sales Data in CRMDMS of previous month considered for CBSL calling\n\nIf PSF Sales Score >=90% - 50 points\nIf 90%>PSF Sales Score>=85% - 25 points\nElse – 0 Points\n\nNote: The channel partner will receive ‘0’ points for this parameter, incase the below mentioned qualifiers are not met\nQualifier 1 – For their own PSF, each dealership has to cover 90% of customers on a monthly basis in PSF on TML CRM system.\nQualifier 2 – Of the number of calls made, If more than 5% or10 nos  (whichever is higher) are found  to be wrong numbers for that month during CBSL calling, entire score goes to ‘0’\n\nFor E.g.\n\n\n\n\n*Please note – This qualifier example is valid for Both Sales as well as Service PSF\nCPSC 3.0 Parameters\n\nC2) Drive Customer Service Satisfaction \t\t\t\t\t\t\tTotal Points - 50\n\nService Experience Score "}, {"id": 1, "doc": "CPSC 3.0 Guidelines", "cat": "CPSC Scorecard", "content": "Tata Motors Ltd, CVBU        CPSC Version 3.0 w.e.f 1st July 2019                            Page 1 of 27   \n \n \n \n \n \n \n \n \n \n \n \nChannel Partner Scorecard (CPSC)  \nMonthly Scorecard Guidelines  \nw.e.f 1st July 2019 \n \n(Version 3.0)\n\nTata Motors Ltd, CVBU        CPSC Version 3.0 w.e.f 1st July 2019                            Page 2 of 27   \n \n \n \nDear Channel Partner, \n \nTata Motors Channel Partner Scorecard (CPSC) program is based on the Tata Motors Balanced \nScorecard framework, which translates strategic objectives into a comprehensive set of performance \nmeasures categorized into Financial, Customer, Business processes and Learning & Development \nperspectives for its channel partners. The parameters flowing in to the CPSC program cascades from \nthe balance score card parameters of Sales & Marketing and Customer Care and further cascades into \nthe performance measures of dealerships. \n \nChannel Partner Score Card (CPSC), which was first introduced in 2014, has now become the most \nimportant performance monitoring tool which not only helps you to gauge the health of your business \nbut also help you to formulate action plan for improvements. \n \nBased on the feedback received from many of you over the last few months, and the emerging \ncompetitive business environment, we have revised the Channel Partner Scorecard, which will be \napplicable from 1st July 2019.  \n \nThe scorecard has equal weightage for Sales & Customer Care and has been simplified to increase \nfocus on the key parameters, which is mix of enablers, processes and outcomes. The elements of \ninfrastructure and customer satisfaction act as a qualifiers and a linkage to dealer infrastructure has \nalso been created.  \n \nThe following are the key updates in CPSC  \n1) Reduce the overall parameters from 17 to 16 \n2) PL wise weightages have been kept same for all the parameters  \n3) All the parameter wise scores will be available at Dealer Level  \n \nWe sincerely believe that adoption of CPSC in letter & spirit will ensure that we are able to provide a \nsuperior customer experience and with that the additional incentives to help improve the profitability \nof the dealership. \n \nAs we move into the next phase of the CPSC program, the new CPSC will be effective from 1St July \n2019 \n \nPayout  \nWhile there is no change in the CPSC payout tiers / slabs, the payout calculation methodology will be \nbasis the below criteria:  \nSlab structure \n \nS No \nTier \nAverage Dealer Score  \nPayout Slabs per \nvehicle \n1 \nExcellence Tier \nScore >= 800 \n5000 \n2 \nSuper Tier \n800> Score >=700 \n4000 \n3 \nStandard Tier \n700> Score >=600 \n3000 \n4 \nPush-up Tier \n600> Score >=500 \n2000 \n5 \nLook-out Tier \nScore < 500 \nNil\n\nTata Motors Ltd, CVBU        CPSC Version 3.0 w.e.f 1st July 2019                            Page 3 of 27   \n \n \nNote: The Parameters will be calculated based on data available with SHQ. There will be no changes \naccepted after the cutoff date for changes. \n \nQualifying criteria for payouts: Dealer will have to achieve minimum defined scores in the following \nparameters to be eligible for any payout  \n \nBS VI Readiness and Infrastructure Audit Adherence - 100% Compliance  \n \nPSF Sales Calling scores of 70% and above \n- \nIn case PSF Sales Scores are not above 70%, the Payout for the month in Question will be Zero. \n- \nBSVI Readiness and Infrastructure Audit Adherence parameter will be evaluated during Q4 FY’20 \nand in case of non-adherence to the above conditions the respective dealer will be given Zero \npayouts for the financial year (In case the Q2 & Q3 payouts have been released than in case of \nnon-compliance, TML will raise debit notes of the same amount for those quarters)  \n \nThe CPSC guidelines effective 1st July 2019 are enclosed herewith. Kindly go through the same and \nensure that your teams have fully understood the metrics & measures. In addition, dealership will be \nfully responsible for entering and maintaining, correct data in CRMDMS as we will be using the same \nfor the scoring against many of the parameters.  \n \nTraining program for new CPSC program has already started and regular training will be further \nplanned in consultation with State Office. \n \nPlease get in touch with the Regional SNM / State Head in case any further clarification is required or \nemail us on cpsc@tatamotors.com \n \nWe are confident you & your team will continue to leverage the CPSC monthly score card program \nand strive for superior performance & customer experience. \nWarm \nRegards,\nR WasanVice President (Sales & Marketing, CVBU)\n\nTata Motors Ltd, CVBU        CPSC Version 3.0 w.e.f 1st July 2019                            Page 4 of 27   \n \nContents \nCPSC 3.0 Score Card  ............................................................................................................................... 5 \nList of Annexures……………………………………………………………………………………………………………………………..24 \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \n \nVersion \nAuthor \nRelease \nV3.0 \nSNM Quality \nJuly 2019\n\nTata Motors Ltd, CVBU        CPSC Version 3.0 w.e.f 1st July 2019                            Page 5 of 27   \n \nCPSC 3.0 \n \nCode \nSection \nParameter \nKey Metrics \nScore \nF1 \nFinancial \nAchievement % for Sales Volume \nOfftake \nDealer volume offtake numbers \n50 \nF2 \nWorking Capital \nNumber of days sales on credit in \nvalue terms \n50 \nF3 \nDe-risk dealer business from \ncyclicality by focusing on Parts \nDealer Parts Target vs Achievement % \n75 \nF4 \nDe-risk dealer business from \ncyclicality by focusing on Value \nadded services \nPenetration in Tata OK and AMC \nPenetration \n50 \nC1 \nCustomer  \nDrive Customer Sales Satisfaction  \nPSF Sales - CBSL calling % \n50 \nC2 \nDrive Customer Service \nSatisfaction  \nPSF CEI - CBSL calling % \n50 \nC3 \nAchievement % for Sales Market \nShare (MS) \nDealer CV Market Share (MS) % \n50 \nC4 \nAchievement % for Workshop \nRevenue \nAchievement % for Workshop \nRevenue \n50 \nC5 \nSales Customer Complaint \nresolution \nCustomer Complaint resolved w"}, {"id": 2, "doc": "KYC PROCESS", "cat": "KYC Process", "content": "PPT Name : CVBU_Dlr_Service_KYC Process\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nCVBU Service KYC Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nCVBU Service KYC\nProcess Flow\nBack to Annexure\nNeed to change Customer Details\nDealer Raises SR in CRM Application\nAssigned to CBSL Team\nCBSL Team Starts Working on it\nCBSL Team Out Calls Customer\nCBSL Team Validates & Confirms the changes by customer\nCBSL Team Makes Required Changes in CRM & Closes the SR\nAny Clarification required from Dealer\nCBSL Changes SR Status \nOn Hold\nDealer to take required action& Give Update in SR\nDealer To take Required Action & Submit the SR\nDealer Submits the SR\nCustomer Contacted?\nCBSL Changes SR Status \nOn Hold\nAre Changes Valid?\nCBSL Team Closes SR with out changing details\nEnd\nStart\nY\nN\nY\nN\nY\nN\n\nCVBU Service KYC – Requirement of KYC\nBack to Annexure\nCurrently all Channel Partner users can update customer (Contact / Account) details in CRM.\n\nThere is no validation process in place to ensure correctness of data maintained in CRM​\n\nThis is causing Data Quality issue leading to Wrong analysis, Issues in new process roll out, Communications with the customer & Customer dissatisfaction\n\nTo avoid this, there should be a single channel to update customer’s details, where data will be validated before updating in CRM thereby ensuring correctness of data\n\nCorrect Data will lead to Proper analysis, Proper roll out of new business processes & Customer satisfaction\n\nCVBU Service KYC – Impact in CRM\nBack to Annexure\nFollowing fields will become Non Editable to All Channel Partner users if ARN is generated for Account, & CRN is generated for contact. In other words, Channel Partner users will not be able to make any changes to the following Fields.\nAccount & Contact creation is not restricted, except Vehicle screen. ( User can not add / Update contacts against the Vehicles directly. while he can do it in Account, Contact, Order screens)\nNote : \nBefore creating any transaction on existing customer, get the Customer details in CRM validated with customer & raise KYC SR if any change is required in these details.\ne.g in workshop, before JC creation, get Customer details in CRM validated with the customer, if any change is required in it then raise KYC SR  before JC creation. This will avoid delay during JC closure.\n\nCVBU Service KYC – Account Screen\nBack to Annexure\nRed highlighted fields will become non-editable if ARN is generated for an account.\n\nCVBU Service KYC – Contact Screen\nBack to Annexure\nRed highlighted fields will become non-editable if CRN is generated for a contact\n\nCVBU Service KYC – Vehicle Screen\nBack to Annexure\nIn Workshop application contact view against the vehicle will be made read only & Channel Partner users can not add contact against the vehicles directly.\nApart from this screen there is no restriction on Account and Contact creation.( User can create new Account & Contacts in Account/ Contact screen, Order screen)\n1. Vehicles Screen\n2. Contact view tab\n3. Vehicle – Contact View Will become read only, user can not create new contact in this view & can not update existing contacts against the vehicle.\n\nCVBU Service KYC – Login\nBack to Annexure\nLogin with DSvM/DSvAdv/DSvCRO User ID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\nActive Position: DSvAdmn\n1. Click on Sitemap\n2. Click on Support\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\nClick on Know Your Customer\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\nPreviously created Details will Reflect here\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\nGo to Customer Request Detail view\n\nCVBU Service KYC –  Different Section of KYC SR\nBack to Annexure\nService Request Section\nUpdates Section\nAttachments Section\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\n1. Click on New\n2. Click on Chassis Number pick applet\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\n1. Search and select the Chassis# for which KYC is required\n2. Click on OK\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\nExisting Customer Details will reflect in the red highlighted box (Both the Contact and Account Details)\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\nSelect “Sub – Area” and “Update Attributes”\n\nCVBU Service KYC – KYC SR Sub Area and Update Attributes\nBack to Annexure\nThis Table shows which fields become editable on selection of Sub Area-Update Attribute values.\nE.g.:1. If user wants to raise request for changing mobile number then he has to select Sub Area  Change Contact Details & Update Attributes  Mobile Number\n2. If Owner of chassis need to be changed then he should select Sub Area  Contact Creation & Update Attributes  Owner\n\nCVBU Service KYC – KYC SR Raise\nBack to Annexure\n1. Enter the required details in “Update Required” fields highlighted in red boxes\n2. Enter Problem Description\n\nCVBU Service KYC – KYC SR Print\nBack to Annexure\nClick on Right Click and Print\n\nCVBU Service KYC – SR Print\nBack to Annexure\nAsk customer to sign on this printed copy\n\nCVBU Service KYC – Attachment\nBack to Annexure\n1. Scroll down and go to Attachments section\n2. Upload the required attachments\n\nCVBU Service KYC – Attachment\nBack to Annexure\nDocuments required to Submit a KYC SR\n\nCVBU Service KYC – SR Submission\nBack to Annexure\nClick on Submit\n\nCVBU Service KYC – SR Submission\nBack to Annexure\n2. Note the KYC SR#\nNote: After Submit the KYC SR all fields will become non-editable\n\nCVBU Service KYC – SR Status Check\nBack to Annexure\nHow to Search or Check the Status of Any KYC SR\n\nCVBU Service KYC – SR Search\nBack to Annexure\nUser has to select the required SR# and go to detail view\nUser can also search with SR#, Opened date, Status, Sub-Status\nOn the KYC screen all the existing details b"}, {"id": 3, "doc": "JC PAYMENT SETTLEMENT", "cat": "Job Card", "content": "PPT Name : CVBU_Dlr_Service_JC_Payment_Settlement\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nPayment and Payment Settlement\nBIP Report\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nPayment and Payment Settlement\nProcess Flow\nBack to Annexure\n\nPayment – Login\nBack to Annexure\nLogin with DSvCash User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nPayment – Job Card Search\nBack to Annexure\n1. Click on Sitemap\nActive Position: DSvCash\n2. Click on Order\n\nPayment – Job Card Search\nBack to Annexure\nClick on Order List / Job Card\n\nPayment – Job Card Search\nBack to Annexure\nQuery with Job Card#\n\nPayment – Receipt Generation\nBack to Annexure\nClick on Job Card# hyperlink\n\nPayment – Receipt Generation\nBack to Annexure\nClick on Payments view tab\n\nBack to Annexure\nPayment – Receipt Generation\n1. Click on `New (+)\n2. Enter Payment Method, Payment Type, Amount and other required details and Save (Ctrl+S)\n3. Click on Receipt# hyperlink\n\nBack to Annexure\nPayment – Receipt Copy Download\n1. Click on Report button\n2. Select Report Name: Payment Receipt and Submit\n\nBack to Annexure\nPayment – Downloaded Receipt Copy\nReceipt Copy\n\nBack to Annexure\nPayment – Payment Settlement\n1. Click on Job Card Invoice view tab\n2. Click on Invoice# hyperlink\n\nBack to Annexure\nPayment – Payment Settlement\nClick on Payment Settlement view tab\n\nBack to Annexure\nPayment – Payment Settlement\nCheck the details\n\nBack to Annexure\nPayment – Payment Settlement\nClick on New (+)\n\nBack to Annexure\nPayment – Payment Settlement\n1. Click on Receipt# pick applet\n2. Query with Payment Date or Payment#\n\nBack to Annexure\nPayment – Payment Settlement\n1. Select the Payment line item\n2. Click on OK\n\nBack to Annexure\nPayment – Payment Settlement\nCheck the payment is Settled against the Invoice\n\nQue. Who will generate Payment Receipt?\nAns. DSvCash will take and generate Payment Receipt\n\nQue. Who will Settle the payment against the invoice?\nAns. DSvCash is responsible for this process.\n\nQue. What is Total Invoice Amount (Payble)?\nAns. Total Invoice Amount (Payable) = Total Invoice Amount + Final TCS Amount\n\nQue. What is Total Invoice Balance Amount?\nAns. Invoice Balance Amount = Total Invoice Amount (Payable) – Settled Amount\nFAQ\n\nQue. What is the process if User is not having CRMDMS User Id?\nAns. The user must contact the System Admin of their organization who must raise a request in CRMDMS Support for CRMDMS User ID creation with required position and responsibility along with approval of their respective TSM/CSM of TML.  \nThe below excel is the User ID creation template in which user details must be filled along with required position and responsibility and a request should be raised to CRMDMS Support along with approval for User ID creation\nFAQ\n\nFor any issues, contact CRMDMS Support through the following channels\n\nRaise a ticket in system\nLogin to : https://itservicedesk.tatamotors.com/TataMotors/login-signin\nRefer attached User guide to raise a ticket.\n\n\n\nRefer the following opcats pertaining to Service Complaint (Excel of Opcat)\n\n2. Call : 020-67136800\n3. Email : crmdms@tatamotors.com\nContact and Support"}, {"id": 4, "doc": "Lost Customer", "cat": "General Process", "content": "1\nLost Customer Analysis\nIn this course we will learn :\nOverview\nCreating an Activity\nCreating a Service Request\n\nOverview\nLost Customer cases can be tracked\nWill help to retain the customers\nWill help to improve Dealer – Customer relationship\n\nRELATED CONTACT \nDETAILS WILL  BE VISIBLE\n\n15\nAfter giving call to customer, if customer agrees to book the appointment for next service, then go to Service Request view tab & create a new Service Request\n\n17\nCLICK ON SERVICE\nREQUEST VIEW TAB\nCLICK ON \nNEW\nSELECT SOURCE"}, {"id": 5, "doc": "JOB CARD CLOSING & INVOICING", "cat": "Job Card", "content": "PPT Name : CVBU_Dlr_Service_JC_Closing & Invoicing_Process\nProcess :\nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nRoles Affected\nProcess Flow\nJob Card Closing & Invoicing Process\nBIP Report\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : \thttps://crmsdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nBack to Annexure\nLogin with DSvAdv User\nID & Password\nApplication URL : \thttps://crmsdms.inservices.tatamotors.com/workshop\nJob Card Closing and Invoicing\n\nBack to Annexure\n2.Click On Order\n1.Click On Site Map\nJob Card Closing and Invoicing\nActive Position DSvAdv\n\nBack to Annexure\nClick On Order List\nJob Card Closing and Invoicing\n\nBack to Annexure\nQuery with Job Card No\nJob Card Closing and Invoicing\n\nBack to Annexure\nClick On Performed Jobs.\nJob Card Closing and Invoicing\n\nBack to Annexure\nClick On Calculate Price All Jobs .\nJob Card Closing and Invoicing\n\nBack to Annexure\n1.Click On Job Card Parts\n2.Check Parts Status Should Shipped\nJob Card Closing and Invoicing\n\nBack to Annexure\nNew field “Target Campaign” introduced in the Part master and in the Jobcard parts line items.\u000bBusiness will create a Service campaign with campaign type as ‘Campaign Discount’ and associate 13000+ part numbers with a flat 5% Discount that is to apply in the JC.\nTarget Campaign flag will be updated as Y for all these 13000+ Part numbers in the parts master.\u000bThe Campaign will be visible in “Campaign” pick applet field for all channel partners and in all Jobcards.\nDPM to pick the campaign at header level in Job card Parts view and click on Get price button to get the 5% Discount against the part # for which the Target Campaign flag updated as Y.\nIf user select any of these part numbers, a Discount of 5% will be applicable in the Job card part line item.\nCampaign Discount\n\nBack to Annexure\nCampaign Discount is not applicable for below mentioned Service Types.\nCampaign Discount\n\nBack to Annexure\nSystem will throw a hard popup at parts Entry Completed and JC closure only if encounters below criteria, \nTarget Campaign = Y\tBilling Type = Paid\tStatus = Shipped\tSR Type is equal to any of the table value.\nPopup: “Campaign Discount is not applicable for this SR Type. Please remove the campaign field value and click on Get price button”\nDPM to remove the Campaign Name from campaign pick applet field and then to click on Get Price button to close the JC for the SR types.\n\nIn case User try to update the Parts Entry completed without a campaign Discount in the parts line item for the applicable parts and for the applicable Service Request, than system will throw a hard popup to restrict user to update parts entry completed.\nTarget Campaign = Y\tBilling Type = Paid\tStatus = Shipped\tSR Type is not equal to the table value.\nPopup: “Campaign Discount applicable for this SR Type. Please maintain campaign field value and click on Get price button”\n\nSame validation is also implemented at JC closure level.\nCampaign Discount\n\nBack to Annexure\nJob Card Closing and Invoicing\nNow the user has facilities to upload picture of Diagnostic report against job card as service history. Field name of the picture is diagnostic report. \nThere will be a part scanner in workshop, each workshop will be having at least 2 barcode scanners. When the user will scan the part through scanner then the picture will get capture and the same picture should get attached in CRM.\nThis process will help Channel partner to track the aggregate part are local or of TML. \nAttachments Requirements: Every line item newly added should have provision to add multiple doc maximum with maximum 10 Mb size. With any format. \nThe image should be upload in the attachment view in the attachment Name. After clicking on the pick applet user can select the screenshot and upload the picture in the against the service history.\n\nBack to Annexure\nSelect Tax Category and Billing  Category\nJob Card Closing and Invoicing\n\nBack to Annexure\nYou can Add Campaign\nJob Card Closing and Invoicing\n\nBack to Annexure\n2.You can edit customer name or Account\n1.Click On More Info View Tab\nJob Card Closing and Invoicing\n\nBack to Annexure\n1.Select Revised Delivery Estimate\n2.Click On Freeze Revised Estimate\nJob Card Closing and Invoicing\n\nBack to Annexure\nClick On Customer Approval Required\nJob Card Closing and Invoicing\n\nBack to Annexure\nSelect Customer Approval value and Save\nJob Card Closing and Invoicing\n\nBack to Annexure\nSelect Supply type SEZ as per requirement\nJob Card Closing and Invoicing\n\nBack to Annexure\nAdditional Jobs\n6 new fields in the Performed Job levels, for Job code addition. Below are the field name:\nAdditional JC flag\nAdditional JC Status\nCustomer Approval Mode\nCustomer Approval Requested Date/Time\nCustomer Approval Received Date/Time\nComments\n\nBack to Annexure\nAdditional Jobs\nThe dealer will while adding the Job codes in the line item level, will mark the Additional JC flag as “Y” if they need customer approval through call for those job codes.\nIf the dealer does not require approval against a job code, they will mark the flag as “N”.\nOn marking the flag status as “Y”, dealer will update the status as Requested in the Additional JC Status against that line item and Enter the requested date/time in the Customer Approval Requested Date/Time field and Update the approval mode as CRM.\nOnce details are updated at the line item level, DSvAdv or DSvM will update the header level Status, i.e., Customer Approval Required as Requested and Enter the Date/Time in the Requested field.\n When dealer calls the customer and ask for their manual approval against that requested Job code, they will update the status from Requested to Approved or Rejected, as per customer confirmation and update the comments as well as Customer Approval Received Date/Time field.\nWhen dealer the line item details, they will update the Customer Approval Required field at the header level and update the Received Date/Ti"}, {"id": 6, "doc": "JOB CARD CAUSE ANALYSIS", "cat": "Job Card", "content": "Introduction\nEarlier scenario : Delay reason field is available at the job card which captures only single reason for the delay in job card closure\n\nRequirement : There was a need to do further analysis on delays to arrive at the actual root cause and have immediate remedy and recurrence prevention in place.\n\nSystem design :\n      1.  Works manager is responsible for this analysis\n      2. WM/CRM / SA can enter the 5 level delay reason\n      3. For every delayed Job card, multi level delay reason analysis can be entered in system / can also be changed subsequently\n      4. These multi level delay reasons, Immediate remedy and recurrence prevention will reflect in analytics Sampoorna Seva reports\n\nAbout The Change\nNew screen Cause Analysis will be created under job card for capturing the delay reason upto 5 level to identify the reason behind delay in vehicle servicing.\n\n        Below are the fields which will be displayed in this screen\nArea (Job Card)\nSub Area (Delay Reason)\nCategory 0 (Delay Reason selected at job card)\nCategory 1 (1st Level Delay Reason)\nCategory 2 (2nd Level Delay Reason)\nCategory 3 (3rd Level Delay Reason)\nCategory 4 (4th Level Delay Reason)\nCategory  5 (5th Level Delay Reason)\nStatus (Having 3 values - Open, Submitted, Re-Open)\nImmediate Remedy (Action taken on immediate basis)\nRecurrence Prevention (Action taken to avoid recurrence)\n\nCategory 1, area and sub area fields will be mandatory before changing the status to Submitted\n\nPre-defined query to search Job cards closed today so that Delay reasons can be entered\n\nDrill down from the list generated in previous slide to go to Job card details (1/2)\nYou can also search SR or Job card number wise\n\nJob Card detailed view has a new tab called “Cause analysis”\n\nDelay reason that was entered at the Job card level\n\nAnalyse the delay reasons at Level 1 to 5 (as applicable)\n\nArrive at the “Immediate remedy” and “recurrence prevention”\n\nAfter the delay reason analysis is done change to submitted\n\nSame will be visible in analytics : “Sampoorna Seva” folder"}, {"id": 7, "doc": "Dlr Administration  Job Profile Update Process", "cat": "General Process", "content": "CVBU Dealer Administration Job Profile Update\n\nProcess Flow\nOverview\n1\nRoles Affected\nCRM Application Process\nIn this course we will learn :\n\nBIP Reports\nFrequently Asked Questions ( FAQ )\nIn this course we will learn :\nContact and Support\n2\n\nOverview\nAdministration screen is accessible from Admin ID\nDOB, Gender, PAN Number, Education / Work Experience, Job Profile can be updated from Administration screen\nAdministrators have to change the Job Profile for any role change of the employee\n3\nApproval and execution of Interested Job Profile is required for updating the Job Profile of Customer Advisor and Team Leader in Sales\n\nBenefits\nJob Profile wise manpower report can be extracted from Analytics\nUpdating Competency is useful to check User skill gaps\nAs only Administrator is having the right, no other person can change the job profile or update the work experience\n4\n\nRoles Affected\n5\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/showroom\n\t\t\thttps://crmdms.inservices.tatamotors.com/workshop\n\nProcess Flow\n6\nLogin With \nDSAdmn /\n DSvAdmn\nClick Site Map\nClick On \nAdministration\nClick on Organization\nExplorer\nClick on Users and \nQuery the required \nUser ID\nCheck and update \nDOB, Gender, PAN,\nEmail ID, Mobile#\nUpdate Job Profile in\nJob Information viewtab\nClick on Sync required\nSkills in Competency\nviewtab\n\nLogin with DSAdmn/ DSvAdmn User\nID & Password\n9\n\n2. Click on Administration\n1. Click on Sitemap\n\nEnter Driving License Availability\nEnter Date of Birth\nEnter Gender\nEnter PAN\nCheck and Update Mobile #, Email ID\n\nAdministration – Education/Work Experience Update Process\n\n2. Click on Administration\n1. Click on Sitemap\n\nSelect viewtab Education/Work Experience\nClick on New (+)\n\nSelect Degree\nSelect Highest Qualification\nWrite Institution Name\nSelect Industry\nWrite Company Name\nEnter Experience in Years\nEnter Experience in Months\nEnter Comments if required\n\nAdministration – Job Profile Update Process\n\n2. Click on Administration\n1. Click on Sitemap\n\nSelect view tab Job Information\nSelect Job Profile\n\nClick Sync Required skills\n1. Select Competency viewtab\n\n41\nSelect Interested Job Profile and Update Status , Dealer Comments\nTo Update Job Profile for Dealer Sales Executive and Dealer Sales Manager\n\n42\nSelect Interested Job Profile and Update Status : Sent for Approval\n\n43\nOnce the request is captured and ‘Sent for Approval’, an email will be sent to his existing Job Profile LOB TSM . The TSM will change the approval status from to “Approved”\n\n44\nThe DSAdmn will also receive an email for any action taken by TSM. He can check this again on the same screen where he had generated the request\n\n45\nDSAdmin can then move the status from ‘Approved’ to ‘Executed’\n\n46\nAs soon as he transitions the status from ‘Approved’ to ‘Executed’ and saves the record the ‘Interested Job Profile’ value will be punched in the ‘Job Profile’ field and also the value in ‘Interested Job Profile’ field will become null.\nUpdate Approval Status : Executed\n\n1. Click on Competency\n3. Skills against the profile reflecting. The Current Level can be updated as per Skills of User\n2. Click on Sync Required Skills\n\n48\nContact and Support :\n\nTo raise Support Request / CRMDMS Help / IT support\u000b\nLogin to: https://itservicedesk.tatamotors.com\u000b\nOr   Mail:   crmdms@tatamotors.com\u000b\nOr  Call :  020 67136800"}, {"id": 8, "doc": "SALES EXTENDED WARRANTY ORDER", "cat": "Warranty", "content": "PPT Name : CVBU_Dlr_Sales_EW Sales\nProcess : \nProcess No :\n\nRoles Required\nThe following positions are required to execute this process\nApplication URL : https://crmdms.inservices.tatamotors.com/showroom\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nCRM Application Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nEW Sales- Introduction\nTata Motors Offer variety of EW products to the customers during retail of vehicles\n\nSome of these products are offered through different discounts, with 100% discount – Partial discount – Partial EW. While other products are offered without any Discount – Paid EW\n\nThough this change Channel Partners will be enabled to sell EW Products through CRM\n\nCampaign Creation : Business will create EW campaigns in CRM and link EW products in campaign for Partial ( in Paid Campaign there will not be any EW Product)\nCP will link these campaigns to opportunity & sell the vehicle (as is Process)\nAfter invoicing Auto EW order will be created for retails with EW campaigns\nCP will do e KYC verification of customer in EW order screen\nIf customer code does not exists in SAP, then such orders will be sent to GDC for customer code creation in SAP.\nAfter customer code creation dealer will enter payment details. If Payment is made to TML then such orders will be sent to GDC approval. \nIf Payment is OK, then GDC will send it back to Dealer for CIF generation.\nDealer will Generate CIF, take customer signature on it &  attach its copy against the order & will send it for CIF approval to GDC.\nIf CIF is ok then GDC will send it back to dealer for Contract Submission else will send it for modification.\nOn CIF approval dealer can place such orders to SAP for contract creation\nEW Sales- Process Overview\n\nEW Sales-Campaign Tagging\nThere is no change in campaign Tagging process, Only change is that user can see all Applicable EW campaigns in Campaign pick applet for tagging.\nUser can Tag only one EW campaign to the opportunity. \nUsers are supposed to tag correct campaigns to the opportunity\n\n1. Click on Sitemap\n2. Click on  Opportunities\nEW Sales-Campaign Tagging\n\nClick on Opty Express\nEW Sales-Opty Creation\n\nDuring Opty Creation user can Tag campaign to the opty.To Tag the campaign user has to click on Campaign Pick Applet\nEW Sales-Opty Creation\n\nAfter Click on Campaign Pick Applet Button, Campaign Pick applet will be opened and user can see all Applicable campaigns in it.\nUser has to select required campaign to tag and click on Ok button.\nEW Sales-Campaign tagging\n\nUser can tag Campaign to Existing Opty in Campaign View As well.\nUser has to Create /Query for the Opty Click on Opty Name Hyperlink Click on Campaign View Click on “+” (Add)Button\nEW Sales-Campaign Tagging\n\nAfter Click on Add Button Campaign Pick applet will be opened\n2. Just click on Go Button So all the applicable campaigns will be visible.\nSelect the campaign from List and click on Ok Button.\nIf user tries to tag multiple EW campaigns then error will be displayed\nEW Sales-Campaign Tagging\n\nOnce retail happens EW order will be created automatically if correct EW campaign is tagged to the opportunity\nDealer has to query for such orders in EW Sales screen – ( This Screen is made available in DSE, DSM, DSAdmn, DFM & DSCo logins)\nChassis, Customer & Product details will be auto populated from the retail\nUser has to do e KYC verification of customer\nThen select document type Form 60 or PAN in case of Form 60 user can not fetch customer code from SAP & user has to send this order to GDC team for customer code creation\nIf user selects PAN ( customer has PAN) then, e KYC verification Verified PAN to be selected from Document pick applet & try to fetch customer code from SAP, if that customer does not exists in SAP then also user has to send such orders to GDC for customer code creation\nFor customer code creation by GDC user has to attach all required documents ( Identity Proof & Address Proof) in attachment section. By selecting proper Type( Identity/Address) and Document Type( PAN, GSTIN, Electricity Bill etc)    \nFor sending order to GDC user has to select Action Required As Customer code Creation & Status As Send For GDC\nIf user has not selected Document Type then error will be displayed while sending order to GDC\nGDC will send such orders back to dealer after customer code creation – in this case customer code will be punched by them in order & status will be Send for Channel Partner & action required will be Payment collection\nIn case if more documents are required by GDC then Status order will be Send For Channel Partner and action required will be Customer Details,  then user has to see comments field and do the needful and send this order back to GDC by selecting Action Required As Customer code Creation & Status As Send For GDC\nUser has to go to Contract details view for getting price of given order & click on Get Price Button.\nThen once price is populated he has to provide Payment details against the order (Payment Made to TML/Dealer, Mode of Payment One Time, and do payment entries in payment view – as is done in any other CRM modules)\nIf Payment Made to is TML then Payment verification by GDC is mandatory, & user has to send order to GDC by\n        Selecting Action Required as “Payment Verification” and Order Status as “Send for GDC”\nIf Payment made to is Dealer then user has to select Sold to Party & Payer code select Action Required As Customer code Creation & Status As Send For GDC\nOverview of EW Process\n\nIf order is send to GDC- GDC will verify payment & on realization of payment they will send back orders to dealer for CIF generation. Such orders will come to Dealers custody with Status as Send for Channel Partner and Action Required = CIF Generation\nIf GDC finds any discrepancy in Payments then such orders will be send back for Payment modification, such orders will be visible in in dealers custody with  Status as Send For Channel Partner and Action required and Payment Modificat"}, {"id": 9, "doc": "VAS WEB PORTAL CUSTOMER", "cat": "VAS Portal", "content": "Value Added Service (VAS) Portal\nPranav Belwalkar  I Date: 29/ 12/ 2025\nCustomer Process - User Manual\n\nValue Added Service (VAS) Portal\n4\nWhy VAS Portal?\nThe mention portal is for Tata Motors CV Business unit to book the Value Added Services products to end customers through new portal. \nTata Motors intends to offer purchase of multiple products viz AMC, Extended Warranty, FMS, and Roadside Assistance to customers. The current portal is live with AMC \nThis new edge portal has better UI; concept of VAS pipeline for tracking orders; E-kyc for customer code creation\nWhere to access?\nPortal will be access Desktop portal link: https://fleetverse.tatamotors.com/login   FleetCare Tab\nWho will have access?\nAll the esteemed Tata Motors customer who has purchase commercial vehicle\n\nTata Motor Customer Portal\n6\nSign In\nOpen the portal URL - https://fleetverse.tatamotors.com/ in any web browser  \nEnter the mobile number registered in while purchase of vehicle\nThrough OTP verification login will be successful and journey can start from FleetCare tab\n2\n1\n3\n\nFleetCare Page\n7\nHome page: Landing page to know VAS offering steps to purchase VAS\nMy Portfolio: Show the list of vehicle purchased \nPortfolio view based on PAN : Provision to see the select the PAN linked with mobile number and see the vehicle portfolio accordingly\nView Detail: Shows the details of vehicle any existing VAS order etc\n2\n1\n4\n3\n\nFleetCare Page\n8\nProvision to switch PAN: Multiple PAN could be linked with given mobile number, there is provision to change the PAN and \nPAN selection view: Based on pan linked customer select the pan and proceed\nVehicle portfolio based on PAN: The vehicle portfolio will shown based on PAN\n1\n\n9\nVAS  Order Creation (1 of 4)\nBook Value Added Services: The button will open the VAS booking page\nProduct details:  Product details viz application, terrain Km etc. to be selected. For Fleetedge enable vehicle odometer readiness will come by default for other details to be fetched\nDealership Details: Dealership selected based on pincode\nDealership for unavailable for pincode:\n1\n2\n3\n\n10\nVAS Product purchase (2 of 4)\nSuggest Plan: The button show the recommended product along with indicative price \nKnow More: More VAS options will be visible after clicking on it\nVAS products details: All the basis details of the products will be shown\n1\n2\n3\n\n11\nVAS Product purchase (3 of 4)\nExplore & Choose: The button will show all the VAS products\nVAS product range: All the applicable VAS products for given vehicle will be shown\nComplete comparison: Complete comparison of the products\n1\n3\n2\n\n12\nVAS Product purchase (4 of 4)\nOrder Creation from product catalog: Order can created by selecting the product from entire product range applicable for the vehicle\nOrder creation through recommended product: Order can be created through recommended product\nVAS Order Page: All the applicable VAS products for given vehicle will be shown\nProvision to edit: Provision to edit the VAS product selected\nCustomer & Dealership details\n1\n2\n3\n4\n5\n\n13\nVAS Order KYC\nKYC and Customer Code Creation:  Post Order creation there is button to proceed for KYC\nChecking for Customer Code: If the KYC details (PAN/ GSTIN) are present in TML system then customer code will be fetched from system\nCustomer Code Updated: On successful fetch action customer code is updated against the order\n1\n\n14\nFleetCare Other Features\nService Tab: The VAS Product Catalog providing details of all VAS products\nFAQ:"}, {"id": 10, "doc": "TATA OK WARRANTY CLAIM", "cat": "Warranty", "content": "PPT Name : CVBU_Dlr_Service_TATA OK Warranty_Claim\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nTATA OK Claim Creation Process\nTATA OK Claim Submission Process\nRejected TATA OK Claim Submission Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nThe TATA OK Warranty Claims contains the following three broad level processes\nProcess Flow\nBack to Annexure\n\nProcess Flow\nBack to Annexure\nTATA OK Warranty Claim Generation\n\nTATA OK Warranty Claim Generation - Login\nBack to Annexure\nLogin with DSvAdv User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nBack to Annexure\nTATA OK Warranty Claim Generation\nActive position: DSvAdv\n1. Click on Sitemap\n2. Click on Order\n\nBack to Annexure\nTATA OK Warranty Claim Generation\nClick on Job Cards\n\nBack to Annexure\nTATA OK Warranty Claim Generation\nQuery with Job Card#\n\nBack to Annexure\nTATA OK Warranty Claim Generation\nToggle to Job Card detail view\n\nBack to Annexure\nTATA OK Warranty Claim Generation\nClick on Generate Claim button\nNote:\n1. TATA-OK Flag should be Y\n2. Tata Ok Warranty Expired should be N\n\nTATA OK Warranty Claim Submission\nProcess Flow\nBack to Annexure\n\nBack to Annexure\nTATA OK Warranty Claim Submission - Login\nLogin with DSvCM User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nClick on Sitemap\nActive Position: DSvCM\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nClick on VCM Claims\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nClick on Warranty Claims\n\nBack to Annexure\nTATA OK Warranty Claim Submission\n1. Query with Job Card#\n2. Click on Go button\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nSelect Claim Category as “Recon Warranty” if part is used against the Job card with billing type: Prolife Warranty for TATA OK Vehicle\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nToggle to Warranty Claim Detail view\n\nBack to Annexure\nTATA OK Warranty Claim Submission\n1. Select Dealer Code Pick Applet\n2. Click on OK\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nSelect Parts Sales Price List\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nSelect Pay Load (if any)\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nEnter Complaint Description, Investigation and Action\n\nBack to Annexure\nTATA OK Warranty Claim Submission\n1. Scroll down and go to Line Items view tab\n2. Click on Add (+)\n3. Enter Complaint Code, Job Code, Fail Code, Part#\n\nBack to Annexure\nTATA OK Warranty Claim Submission\n3. Change the Status as Ready for VCM\n2. Click on Parts Entry Complete\n1. Click on Job Entry Complete\n\nBack to Annexure\nTATA OK Warranty Claim Submission\nClick on Submit Claim\n\nRejected TATA OK Warranty Claim Submission\nProcess Flow\nBack to Annexure\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission - Login\nLogin with DSvCM User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\nActive Position: DSvCM\nClick on Sitemap\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\nClick on VCM Claims\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\nClick on Warranty Claims\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\n1. Query with Job Card#\n2. Click on Go button\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\nSearch with Job card# or Claim Status as Rejected\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\nToggle to  Warranty Claims Detail view\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\nSelect the Status as Under Change\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\n2. Untick Job entry Complete\n3. Untick Parts entry Complete\n1. Check the VCM Comments\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\n1. Also you can check VCM Comments here if present\n2. Do the necessary corrections as per the VCM Comments\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\n1. Tick Job entry Complete\n2. Tick Parts entry Complete\n1. Select Claim Status as Re-ready for VCM\n\nBack to Annexure\nRejected TATA OK Warranty Claim Submission\nClick on Submit Claim\n\nQue. Who is Generate TATA OK Warranty Claim?\nAns. DSvAdv will generate the claim.\n\nQue. What are the conditions for TATA OK Warranty Claim generation?\nAns. 1) There should be at least one line item in both job and part with billing type as TATA OK Warranty\n         2) Generate Claim button should be clicked within 7 days of Initial Job Card Closure Date.\n\nQue. Who can Submit Warranty Claim? \nAns. DSvCM will enter all the details and Submit the claim\n\nQue. How to check and re submit the Rejected Warranty Claims?\nAns. DSvCM will check in VCM Claims with the job card number or Rejected status. After that change the Status as under Change and check the VCM Comments. After required changes Submit the claim.\n\nQue. Can User Change the Claim Category on Warranty Claims?\nAns. Yes, User can change Claim category to TATA OK WARRANTY.\nFAQ\n\nFor any issues, contact CRMDMS Support through the following channels\n\nRaise a ticket in system\nLogin to : https://itservicedesk.tatamotors.com/TataMotors/login-signin\n2. Call : 020-67136800\n3. Email : crmdms@tatamotors.com\nContact and Support"}, {"id": 11, "doc": "ALL DLR CUSTOMER PERSONAL IDENTIFYING INFORMATION MASKING", "cat": "General Process", "content": "PII –  CRM Encryption\n© Copyright, Confidential, Tata Motors Limited\n\nPAN\nDriving License\nBank Account No\nAadhar\nCustomer , Dealer\nCustomer\nEmployee\nCustomer\nPII –  Masking Formats\n\nPII –  Application level Masking [ Company ]\nAfter\nBefore\nAfter\n\nPII –  Application  level Masking [ Individual Customer ]\nBefore\nBefore\nAfter\nAfter\n\nPII –  Application  level Masking [ Transactional ]\nBefore\nAfter"}, {"id": 12, "doc": "WARRANTY AMC DETAILS CHECKING", "cat": "Warranty & AMC", "content": "PPT Name : CVBU_Dlr_Service_Warranty & AMC_Details_Check\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nWarranty & AMC Details Checking Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\n\nProcess Flow\nBack to Annexure\nWarranty and AMC Details Check\n\nBack to Annexure\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nLogin with DSvAdv / DSvM User ID & Password\nWarranty and AMC Details Check – Login\n\nBack to Annexure\n2. Click on Sitemap\n1. Active Position : DSvAdv/ DSvM\nWarranty and AMC Details Check – Vehicle Enquiry\n\nWarranty and AMC Details Check – Vehicle Enquiry\nBack to Annexure\nClick on Vehicles\n\nBack to Annexure\nClick on Tata Vehicles List\nWarranty and AMC Details Check – Vehicle Enquiry\n\nBack to Annexure\nWarranty and AMC Details Check – Vehicle Enquiry\n1. Select All Visible Vehicles from dropdown\n2. Click on Query button\n\nBack to Annexure\nWarranty and AMC Details Check – Vehicle Enquiry\nQuery with Chassis number or Registration number\n\nBack to Annexure\nWarranty and AMC Details Check – Vehicle Enquiry\n2. Click on Show More\n1. Vehicle Details will reflect here\n\nBack to Annexure\nWarranty and AMC Details Check – Warranty Details\nWarranty Details of the Vehicle will reflect here\n\nBack to Annexure\nWarranty and AMC Details Check – Extended Warranty Details\nExtended Warranty Details of the Vehicle will reflect here\n\nBack to Annexure\nWarranty and AMC Details Check – AMC Details\nAMC Details of the Vehicle will reflect here\n\nBack to Annexure\nWarranty and AMC Details Check – AMC Details\n1. Click on AMC Contract View tab\n1. AMC Contract Details will reflect here\n\nQue. Who Can Check Vehicle Details ?\nAns. DSvAdv, DSvM, DSvAdmn, DSvCRO can check the vehicle details.\n\nQue. On which screen/view warranty details will reflect?\nAns. User has to select “All Visible Vehicle” from drop down.\n\nQue. How to check AMC details of a vehicle?\nAns. After searching with the Chassis# user has to click on Show More button to check the EW and AMC Details in the header level.\n\nQue. How to check AMC details of a vehicle?\nAns. User has to click on AMC Contract view tab to get the AMC details against the vehicle.\n\nQue. What to do if Warranty details of any chassis# is not updated correctly?\nAns. User has to raise a REQ# with all necessary details and send it to the CRMDMS team.\nFAQ\n\nQue. Which position is required to create AMC Order in CRMDMS?\nAns. Dealer Service Admin and Dealer Service Advisor position and responsibility in workshop application is required to create AMC order.\nIf user is holding multiple position in one login ID, the they should ensure the Active selected position is as required for the transaction. To Change Position follow the path : Sitemap -> User Profile Preferences -> Change Position -> Select the required position -> Click on Change Position.\n\nQue. What is the process if User is not having CRMDMS User Id?\nAns. The user must contact the System Admin of their organization who must raise a request in CRMDMS Support for CRMDMS User ID creation with required position and responsibility along with approval of their respective TSM/CSM of TML.  \nThe below excel is the User ID creation template in which user details must be filled along with required position and responsibility and a request should be raised to CRMDMS Support along with approval for User ID creation\nFAQ\n\nFor any issues, contact CRMDMS Support through the following channels\n\nRaise a ticket in system\nLogin to : https://itservicedesk.tatamotors.com/TataMotors/login-signin\nRefer attached User guide to raise a ticket.\n\n\n\nRefer the following opcats pertaining to Warranty and AMC (Excel of Opcat)\n\n2. Call : 020-67136800\n3. Email : crmdms@tatamotors.com\nContact and Support"}, {"id": 13, "doc": "SAP WARRANTY", "cat": "Warranty", "content": "URL - https://nextgenapps.tatamotors.com/iConnect-IT-Portal/landing-page\nUse DSvCM CRM user ID and password to login into application.\nSAP Warranty\n\nLogin Page will appear as below >> Click on SAP Warranty\nClick on Transaction >> GST Invoice\nSAP Warranty\n\nSearch Window will appear as below >> Select Invoice Search criteria i.e. Credit Posting Month, Invoice Type >> Invoice Status and click on Search\nSAP Warranty\n\nBased on search criteria invoice details will appear >> Click on Action Icon\nSAP Warranty\n\nClick on Generate IRN and GST Invoice button for generating IRN & GST Invoice. If Dealer is not IRN applicable Generate GST button will be there to generate GST Invoice.\nSAP Warranty\n\nOn successful IRN generation system will show notification and IRN details will get stamped against transaction\nSAP Warranty\n\nClick on Submit button >> Click on Yes >> Invoice will move from Pending With Dealer to Ready For Printout / Upload Status.\nSAP Warranty\n\nNow do search with Invoice status Ready For Printout / Upload Status.\nBased on search details will appear >> Click on Action to Download & Upload GST invoice.\nSAP Warranty\n\nClick on Download GST Invoice button >> Invoice will get downloaded in PDF format.\nSAP Warranty\n\nTo upload document click on Document Tab >> Choose File >> Select Digitally signed document >> Click on Upload Document\nSystem will auto validate whether document is digitally signed or note. If digital signature is not present validation message will appear.\nSAP Warranty\n\nIt is mandatory to upload document which is downloaded from system post digital signature on it. Uploaded invoice copy will get validated with system generated invoice copy. If both are matching then only system will accept uploaded invoice copy. Any mismatch in uploaded invoice copy and system generated invoice copy will restrict document upload.\nSAP Warranty\n\nAfter successful validation of uploaded document with backend document file will get uploaded successfully.\n\nSAP Warranty\nIRN details will be visible on IRN details tab\n\nUpload Document and Click on Submit. Click on Yes Invoice will get submitted successfully\n\nFor IRN Applicable dealer invoice will reflect in Settlement In Progress status.\nFor Non-IRN Applicable dealers it will reflect in Awaiting Approval status."}, {"id": 14, "doc": "VCM NEXTGEN PROCESS", "cat": "Vehicle", "content": "PPT Name : CVBU_DLR_VCM_NEXTGEN_PROCESS\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nCRM Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nThe following positions are required to execute this process\nApplication URL :      https://portal.cvnextgenapps.tatamotors.com\n\nLog in With DSAdmn/DFM User Id\nLog in Page\n\nVCM Process\n1. Select Position\nClick on Account Statement\n\n1. Select Date Range from calendar View\n2. Select Dealer/Branch Code\n3. Select Payer code type\n4. Click on Get Payer code\nVCM Process\n\n1. Select Payer Code\n2. Click on Search Button\nVCM Process\n\n2. Click on View detail Statement\nVCM Process\n\nClick on Export Report Button to download the report\nVCM Process\n\nVCM Process\n1. Select Position\nClick on Cleared Documents\n\nVCM Process\n1. Select Date Range from calendar View\n3. Click on Search Button\n2. Select Dealer/Branch Code\nNote: Selecting from date and to date. In production application at a time user can only view one month data or difference between from date and to date should not be greater than 31 days.\n\nClick on Export Report Button to download the report\nVCM Process\n\nBack to Annexure\nOutstanding Documents Process\nVCM Process\n\nVCM Process\n1. Select Position\nClick on Outstanding Documents\n\nVCM Process\nSelect Date Range\nNote: Selecting from date and to date. In production application at a time user can only view one month data or difference between from date and to date should not be greater than 31 days.\n1.Select Dealer/Branch Code\n2. Click on Search Button\n\nVCM Process\nClick on Export Report Button to download the report\n\n1. Select Position\n2. Click on Cleared Document\nExported Data\nVCM Process\n\nBack to Annexure\nAccount Statement for Vehicle Code\nVCM Process\n\nVCM Process\nClick on Account Statement for Vehicle Code\n\n1. Select Date Range from calendar View\n2. Select Dealer/Branch Code\n3. Select Payer code type\n4. Click on Get Payer code\nVCM Process\n\n1. Select Payer Code\n2. Click on Search Button\nVCM Process\n\n2. Click on View detail Statement\nVCM Process\n\nClick on Export Report Button to download the report\nVCM Process\n\nBack to Annexure\nBack Order Process\nVCM Process\n\nVCM Process\nClick on BO Order No Query/Part No\n\nVCM Process\n1. Enter Order No\n4. Click on Search Button\n3. Click on Export Button to download the report\n2. Select Dealer/Branch Code\n\nVCM Process\n1. Select Part No\n2. Select Dealer/Branch Code\n3. Click on Search Button\n\nVCM Process\nClick on Export Button to download the report\n\nVCM Process\nClick on Order No Hyperlink for Order detailed view\n\nVCM Process\nClick on Export Button to download the report\n\nBack to Annexure\nVCM  Back Order Summary Process\nVCM Process\n\nVCM Process\nClick on Export Button to download the report\n\nVCM Process\nClick on Order Type Hyperlink for Order detailed view\n\nVCM Process\nClick on Export Button to download the report\n\nVCM Process\nClick on Export Report Button to download the report\n\nBack to Annexure\nVCM  Despatch Details Process\nVCM Process\n\nVCM Process\n2. Select Dealer/Branch Code\n3. Click on Search Button\nNote: Selecting from date and to date. In production application at a time user can only view one month data or difference between from date and to date should not be greater than 31 days.\n1. Select Date Range from calendar view\n\nVCM Process\nClick on Export Report Button to download the report\n\nVCM Process\nClick on Export Report Button to download the report\n\nVCM Process\nClick on Despatch Status\nExported Data\n\nBack to Annexure\nVCM  Invoice Query on Date\nVCM Process\n\nVCM Process\nClick on Invoice Query On Date\n\nVCM Process\n1. Select Date Range from calendar view\n3. Click on Search Button\nNote: Selecting from date and to date. In production application at a time user can only view one month data or difference between from date and to date should not be greater than 31 days.\n2. Select Dealer/Branch Code\n\nVCM Process\nClick on Export Report Button to download the report\n\nBack to Annexure\nVCM  Invoice Query\nVCM Process\n\nVCM Process\n1. Enter Invoice Number\n2. Click on Search button\n1. Enter Invoice Number\n2. Select Dealer/Branch Code\n\nVCM Process\n1. Enter Invoice Number\nClick on Export Report Button to download the report\n\nVCM Process\n1. Enter Invoice Number\nExport Details\n\nBack to Annexure\nVCM  Order Enquiry by Order No/Part No\nVCM Process\n\nVCM Process\n2. Enter Dealer/Branch Code\n3. Click on Search Button\n1. Enter Order No\n\nVCM Process\n2. Enter Dealer/Branch Code\nClick on Export Report Button to download the report\n\nVCM Process\nClick on VCM\nClick on Item Srl hyperlink\n\nVCM Process\n3. Enter Dealer/Branch Code\n4. Click on Search Button\n1. Enter Part No\n2. Enter From Date To Date\nNote: Selecting from date and to date. In production application at a time user can only view one month data or difference between from date and to date should not be greater than 31 days.\n\nVCM Process\nClick on Export Report Button to download the report\n\nBack to Annexure\nVCM  Order Registered\nVCM Process\n\n1. Select Date Range from calendar view\n3. Click on Search Button\nNote: Selecting from date and to date. In production application at a time user can only view one month data or difference between from date and to date should not be greater than 31 days.\n2. Enter Dealer/Branch Code\nVCM Process\n\nClick on Export Report Button to download the report\nVCM Process\n\nClick on Export Report Button to download the report\nVCM Process\n\nBack to Annexure\nVCM  Supply Against Order\nVCM Process\n\nClick on Supply Against Order\nVCM Process\n\n1. Enter Order Number\n3. Click on Search Button\n2. Enter Dealer/Branch Code\nVCM Process\n\nClick on Export Report Button to download the report\nVCM Process\n\n1. Enter Order Number\n2. Click on Search Button\nExported Data\nVCM Process\n\nClick on Export Report Button to download the report\nVCM Process\n\nBack to Annexure\nVCM Order Status Process\nVCM Process\n\n1. Select Date Range from calendar View\nNote: Selecting from date and to date. In production application at a time user can only view one"}, {"id": 15, "doc": "GO GREEN TREE PLANTATION CERTIFICATE GENERATION", "cat": "General Process", "content": "PPT Name : CVBU_DLR_GO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nRoles\nProcess Flow\nCRM Application Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nRoles Required\nApplication URL : https://crmdms.inservices.tatamotors.com/workshop\n\t\thttps://crmdms.inservices.tatamotors.com/showroom\nThe following positions are required to execute this process\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - SALES\nProcess Flow\nBack to Annexure\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - SALES\nBack to Annexure\nLogin with User\nID & Password\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - SALES\nBack to Annexure\n1. Click on Sitemap\n2. Click on Vehicle\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - SALES\nBack to Annexure\nClick on Vehicles\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - SALES\nBack to Annexure\n1. Select the All Visible Vehicles\n2. Query with the chassis number\n3. Click on Go\n\nCertificate Download\n2. Click on Tree Id Hyperlink\n1. Click on Go Green Certificate View Tab\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - SALES\n1. Click on Button\n2. Click on Hyperlink\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - SALES\nClick on Dowload\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION –\nFor Service\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\nProcess Flow\nBack to Annexure\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\nLogin with User\nID & Password\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION – For Service\n1. Click on “Validate Go Green Certificate”\n2. Click on “OK”\nNote : In the backend, there's a flag that switches to \"Y\" every time the button is clicked. If the flag isn't \"Y\", generating the JC invoice won't be possible, and a clear pop-up message will remind users to click the \"Validate Go Green Certificate\" button before proceeding with invoice generation.\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\nClick on “OK”\nNote : At JC Invoice view, new button “Validate Go Green Certificate” introduced, this button has to be clicked mandatorily before generating the JC invoice, if the JC Invoice Value is >= 2500. This value is Final Invoice Amount (with Tax).\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\nWhen the \"Validate Go Green Certificate\" button is clicked, different scenarios can occur:\n Scenario 1: If the Tree ID is not linked to the chassis:\n\t- A new Tree ID will be assigned to the chassis.\n  \t- The flag will be set to \"Y\" as the button is clicked.\n   \t- A message will pop up saying, \"Tree ID is now linked with this chassis. Proceed with  invoice generation.\"\n Scenario 2: If the Tree ID linked to the chassis has expired:\n\t- A new Tree ID will replace the expired one.\n\t- The flag will be set to \"Y\" as the button is clicked.\n\t- A message will pop up saying, \"Tree ID is now linked with this chassis. Proceed with invoice generation.\"\n Scenario 3: If the Tree ID is linked to the chassis and not expired:\n\t - No changes will be made to the Tree ID.\n\t - The flag will be set to \"Y\" as the button is clicked.\n\t - A message will pop up saying, \"Tree ID is already linked with this chassis. Proceed with invoice generation.\"\nScenario 4: If the Tree ID is not linked or expired, and no tree inventory is available:\n\t- No new Tree ID will be assigned.\n\t- The flag will be set to \"Y\" as the button is clicked.\n\t- A message will pop up saying, \"Tree ID cannot be linked due to unavailability in the inventory. Proceed with invoice generation without Go \t  Green Certificate.\"\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\n2. Click on Vehicles\n1. Go to Sitemap\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\nClick on Vehicles\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\n1. Select All Visible Vehicles\n2.Query With Chassis No.\n3. Click on Go\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\n1. Click on “ Go Green Certificate”\n2. Click on Tree Id Hyperlink\n\nGO_GREEN_TREE_PLANTATION_CERTIFICATE GENERATION - For Service\n3. Click on Download\n2. Click on Hyperlink\n1. Click on Generate Button\n\nQue. How to download Go Green Certificate?\nAns. Please follow the path: Login >> Sitemap >> Vehicles>> Vehicles>> Select the All Visible Vehicle from Dropdown >>                     \n         Query with chassis no. >> Go Green Certificate View Tab >> Click on hyperlink and Generate Certificate >> Click on  \n         Certificate Hyperlink and Download in PDF file.\n\nQue. Who can generate Go Green Certificate?\nAns. DSAdmn, DSM, DSvAdv, DSvM can generate certificate.\n\nQue. When do need to click on validate button in service?\nAns. : If the JC Invoice Value is >= 2500. This value is Final Invoice Amount (with Tax), then we need to click.\n           At JC Invoice view, have to click on “Validate Go Green Certificate”, this button has to be clicked mandatorily before                                \n           generating the JC invoice.\n\nQue. What will be the validity of the certificate?\nAns.  The validity of the certificate is 365 days.\nFAQ\n\nFor any issues, contact CRMDMS Support through the following channels\n\nRaise a ticket in system\nLogin to : https://itservicedesk.tatamotors.com/TataMotors/login-signin\n\n2. Call : 020-67136800\n3. Email : crmdms@tatamotors.com\nContact and Support"}, {"id": 16, "doc": "Sales Event Simplification", "cat": "General Process", "content": "Event Management Simplification\u000bEvent Planning & Execution Guide for the DSMs\n\nOverview\nManagement of Authentic Public Relation Events, Experiential Marketing Programs\nIt has to be associated against an Opportunity\nMultiple events can be created under same event plan\nDelivering Key Product Messages, Demonstrating Performance Technology\n2\n\nClick on ‘+’ Symbol\nThe status will be ‘In Planning’ until all the Events are created for that particular plan\nOnly one Event Plan can be created in a single month\nThe Event Name is auto-populated based on the dealer name  & the current month\nThe Planned Start Date & the Planned End Date will be auto-populated as “1st \n      Date & the last date of the said Month” once the Event Plan is created\nPlanned Start Date & Planned End Date can be modified as per requirement\n\nThe Events section below the Event Plan, \nhas been displayed in both the list view as well as the Form view\n\nClick on ‘+’ Symbol\nEnter the Event details like Name, Type, Planned Date, DSE, LOB, PPL, PL, MM Geography, \nIntended Application & Target  C0\nOnly one event plan can be created in a particular month. Multiple events can be created under same event plan\n\nThe fields pertaining to the Event execution are read-only as the Plan Status is ‘In Planning’\nThe ‘Service Division participated’ field is to be used primarily for Events with type as ‘Fuel Trial’\n‘Service Division Name’ field will be mandatory if Service Division participated is selected as “Yes”. \n     For eg., if Cargo Motors Jalandhar Service division has participated in the event, \nthen Service division name has to be updated as 1009900-Sv&Pa-Jalandhar-CargoJ\n\nThe DSM can create multiple Events under  a single Event Plan in the same procedure\nOnce the Event planning has been completed, the DSM needs to update the Plan Status as ‘Sent for Approval’\nThe corresponding Area Manager (DAM) needs to approve the plan, which will facilitate approval of multiple \n    Events in one go\n\nOnce the DAM has approved the Event Plan, the fields- Name, Type, Planned Date, DSE, LOB, PPL, PL, MM Geography, I\nIntended Application & Target C0 will be made read-only & the execution based fields will be editable for data capture\n\nExecution Date is the Actual execution date of the event. If current date is greater than planned date and execution \n       date is blank, then status will be changed to ‘Delayed’. After punching the execution date, \n        status will be changed to ‘Executed’.\nNumbers of persons attended the event has to be entered in the No. of people attended field.\n\nEvent Association against Opportunity\nToggle view to Opportunity Form\n\nThe Events displayed are based on the Event Planned End Date. Only those Events are visible to dealer\n user which are of his organization & where the Planned End Date >= Current Date and Planned Start Date <= Current Date.\nAlso Events with status ‘Approved’ only are displayed here.\n\nEvent Association against Opportunity\nPlease note, whoever creates the event, ultimately the sale will be reflected against the person’s \nname who will create the opportunity\nEvent Name reflecting here"}, {"id": 17, "doc": "OBIEE Theme Based Service", "cat": "Reports/OBIEE", "content": "2\nIn this course we will learn :\nOverview\nAdministrative Reports\nOperational Reports\nReport creation with basic OBIEE elements\n\n3\nOverview\nWeb platform for the content\nOBIEE provides significant information for making critical decisions\nGraphical Reporting (Charts, Pivots, Gauges, etc.)\nReports to the needs of individual users or groups\nReports available in Dashboard as well as some Customized reports can be found under Shared Folder  TMP  OLAP REPORTS FOR TRAINING\n\n5\nOverview\nReturns generated from Service & Spares for the Dealer against expenses incurred in the business\nEvaluate contribution of different channels on revenue\nTrack performance of workshop based on different parameters\nAnalyzing Profitability of the Organization\n\n6\nBusiness Benefit:\n*RPV-Revenue Per Vehicle\nThis report will help dealer management to find out the average revenue generated by servicing of a vehicle in a month. This will separately show the revenue per vehicle generated from labour and spare.\n\n7\nBusiness Benefit:\nThe report will help channel partner to get service type wise revenue. This will also help them to identify on which areas they need to focus for improvement.\n\n8\nBusiness Benefit:\nUsing this report channel partner management can visualize LOB wise revenue to get the business health. The top level summary report will show the totals labour, spare parts and lubricant revenue including warranty, FSB & AMC .\n\n9\nBusiness Benefit:\nThis report will help to understand the LOB wise invoiced amount. The invoiced amount will also include\n\n10\nBusiness Benefit:\nThis is the pictorial representation of LOB wise total invoiced amount.\n\n11\nBusiness Benefit:\nThis report is useful to get the summary of warranty values raised by channel partner and are settled by TATA Motors.\n\n12\nBusiness Benefit:\nThe accidental and non-accidental vehicle inflow and outflow report gives the clear picture of business growth/de-growth. This report will help management to focused on respective categories where business is lagging.\n\n13\nBusiness Benefit:\nCost and time estimation is one of the important aspect for customer. This report will help to monitor the percentage of job card for which time and cost estimation are provided by service advisor. It will also help to track the percentage of job card where actual time/cost is deviated above the relaxation bracket from the estimation.\n\n14\nBusiness Benefit:\nThis report can be used to monitor the percentage of vehicles which are released on same day, in two days and in 3 days. Management can do route cause analysis if the percentage is dropping below the target line.\n\n15\nBusiness Benefit:\nJob Card and OTC sale wise revenue segregation will help channel partner's management to find out if it is matching the target of spares sales, if not then focus should be raised on the respective area .\n\n16\nBusiness Benefit:\nJob Card and OTC sale wise revenue segregation will help channel partner's management to find out if it is matching the target of spares sales, if not then focus should be raised on the respective area .\n\n17\nBusiness Benefit:\nThis report is useful to get distributor and month wise parts purchased summary from distributor. This will give an idea to management on the trend of parts purchase from respective distributors.\n\n18\nBusiness Benefit:\nThis report is useful to get distributor and month wise parts purchased summary from distributor. This will give an idea to management on the trend of parts purchase from respective distributors.\n\n19\nBusiness Benefit:\nMonth wise parts sales through workshop and OTC is useful to understand the improvement/down-growth of spares part sale. Business can raise alarm if figures are going below the target line.\n\n20\nBusiness Benefit:\nThis report gives analysis for workshop & counter sale under different billing types.\n\n21\nBusiness Benefit:\nThis report provides the Month by Month comparison for Tata Motors Purchases and the Local Purchases (in Rs. Lacs). \u000bThe Graph below provides a visual comparison between both and depicts the trend in the purchase for TM v/s Local spare parts. \u000bLeft Axis represents the TM Purchase Amount and the Right Axis represents the Local Purchase Amount\n\n22\nBusiness Benefit:\nThis report summarizes month on month parts purchase from local Vendors.\n\n23\nBusiness Benefit:\nThis Report displays the Current Inventory Valuation of your Partner's Organization Inventory Location with Grand Total at the end.The Inventory Valuation is based on the Weighted Average Cost in CRMDMS.\n\nOverview\nDaily Reporting analysis\n25\nIdentifying the strengths & weakness in organizational growth with peer review analysis\nDetailed track for exact evaluation of workshop performance & follow ups\nTrack purchase back orders & purchase fulfill ratio along with Sales to manage inventory maintaining best FFR\n\n26\nBusiness Benefit:\nThe details of job card report can be used for daily tracking of open job cards.\n\n27\nBusiness Benefit:\nThis report is showing the labour and parts invoice amount for every job card in a period. In Paid labour and paid spare only the value entered under paid service is displayed and under Total labour and total spare amount including warranty, FSB & AMC will also display.\n\n28\nBusiness Benefit:\nThe report shows the list of cancelled invoices in a particular time period. This will help to track cancelled invoices and route cause analysis can be done.\n\n29\nBusiness Benefit:\nThe report shows technician and service advisor wise job values. Performance of service advisor and technician can be tracked using this.\n\n30\nBusiness Benefit:\nThe report shows technician wise job values. Performance of workshops technician can be tracked using this.\n\n31\nBusiness Benefit:\nThe report shows service advisor wise job values. Performance of workshops service advisor can be tracked using this.\n\n32\nBusiness Benefit:\nThe channel partner purchase back order will help management to track how many orders are pending to dispatch by respective distributor. Next order can be pl"}, {"id": 18, "doc": "TRACKING SHEET", "cat": "Tracking Sheet", "content": "PPT Name : CVBU_Dlr_Service_Tracking_Sheet\nProcess : \nProcess No :\n\nCourse Content\nIn this course we will learn:\n\nOverview\nRoles\nProcess Flow\nService Tracking Sheet Process\nFrequently Asked Questions (FAQ)\nContact & Support\n\nApplication URL : \thttps://crmdms.inservices.tatamotors.com/workshop\nThe following positions are required to execute this process\nRoles Required\n\nBack to Annexure\nTrack details of all pending Vehicles/Service Requests.\n\nRole wise tracking sheets are generated on daily basis.\n\nHelps User to track the task pending for all the vehicles based on different User roles.\nOverview :\nCVBU Service Tracking Sheet Process\n\nProcess Flow\nBack to Annexure\nProcess Flow\n\nBack to Annexure\nLogin with DSvAdv User\nID
